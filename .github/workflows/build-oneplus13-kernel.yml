name: Build OnePlus 13 Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: OnePlus 13 kernel version to build
        required: true
        type: choice
        options:
          - 6.6.89 A16
          - 6.6.118 A16
          - 6.6.66 A15
          - 6.6.30 A15
          - 6.6.89 CPH A15
          - 6.6.56 CPH A15
          - all
        default: 6.6.89 A16
      ksu_variant:
        description: KernelSU variant
        required: true
        type: choice
        options:
          - KSUN
          - KSU
        default: KSUN
      ksu_branch:
        description: KernelSU branch, tag, or commit (empty uses main for KSU, dev for KSUN)
        required: false
        type: string
        default: ''
      use_susfs:
        description: Enable SUSFS
        required: true
        type: boolean
        default: true
      susfs_branch:
        description: SUSFS branch or commit (empty auto-selects gki-android15-6.6)
        required: false
        type: string
        default: ''
      nethunter:
        description: Enable Nethunter inline configs
        required: true
        type: boolean
        default: true
      wireless_modules:
        description: Build and package wireless kernel modules
        required: true
        type: boolean
        default: true
      ddk:
        description: 'Build with Bazel/Kleaf and produce the qcacld-3.0 DDK module (6.6.118 A16 only; ignored elsewhere)'
        required: false
        type: boolean
        default: true
      ddk_injection:
        description: 'Patch qcacld for frame injection in monitor mode (experimental; requires ddk, so 6.6.118 A16 only)'
        required: false
        type: boolean
        default: true
      optimize_level:
        description: Compiler optimization
        required: true
        type: choice
        options:
          - O2
          - O3
        default: O2
      lto:
        description: Link-time optimization
        required: true
        type: choice
        options:
          - thin
          - full
          - none
        default: thin
      compiler:
        description: Clang toolchain source
        required: true
        type: choice
        options:
          - zycromerz-19
          - manifest
        default: zycromerz-19
      use_opt_patches:
        description: Apply WildKernels optimization patches
        required: true
        type: boolean
        default: true
      kernel_uname:
        description: Kernel uname suffix
        required: true
        type: string
        default: OP-WILD
      build_timestamp:
        description: Custom uname timestamp (empty uses current UTC time)
        required: false
        type: string
        default: ''
      clean_build:
        description: Build without restoring ccache
        required: true
        type: boolean
        default: false
      release_type:
        description: Publish the successful build
        required: true
        type: choice
        options:
          - none
          - prerelease
          - release
        default: none
      debug:
        description: Build modules and upload debug artifacts
        required: true
        type: boolean
        default: false

jobs:
  plan:
    name: Plan build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Generate build matrix
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          CHOICE="${{ inputs.kernel_version }}"

          case "$CHOICE" in
            "6.6.89 A16")
              CONFIGS='["configs/OP13-6.6.89.json"]'
              ;;
            "6.6.118 A16")
              CONFIGS='["configs/OP13-6.6.118.json"]'
              ;;
            "6.6.66 A15")
              CONFIGS='["configs/OP13-6.6.66.json"]'
              ;;
            "6.6.30 A15")
              CONFIGS='["configs/OP13-6.6.30.json"]'
              ;;
            "6.6.89 CPH A15")
              CONFIGS='["configs/OP13-CPH-6.6.89.json"]'
              ;;
            "6.6.56 CPH A15")
              CONFIGS='["configs/OP13-CPH-6.6.56.json"]'
              ;;
            "all")
              CONFIGS='["configs/OP13-6.6.89.json","configs/OP13-6.6.118.json","configs/OP13-6.6.66.json","configs/OP13-6.6.30.json","configs/OP13-CPH-6.6.89.json","configs/OP13-CPH-6.6.56.json"]'
              ;;
            *)
              echo "::error::Unknown kernel_version choice: $CHOICE"
              exit 1
              ;;
          esac

          echo "matrix={\"config\":$CONFIGS}" >> "$GITHUB_OUTPUT"
          echo "Matrix: {\"config\":$CONFIGS}"

  build:
    name: ${{ matrix.config }}
    runs-on: ubuntu-latest
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            aria2 git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 python-is-python3 python3-requests \
            ccache jq bc dos2unix kmod libdw-dev elfutils pigz zstd
          sudo apt-get clean

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          mkdir -p "$CACHE_DIR"
          {
            echo "CCACHE_DIR=$CACHE_DIR"
            echo "CCACHE_LOGFILE=$GITHUB_WORKSPACE/ccache.log"
            echo "CCACHE_MAXSIZE=12G"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_COMPRESSION=true"
            echo "CCACHE_COMPRESSION_LEVEL=3"
            echo "CCACHE_DIRECT=true"
            echo "CCACHE_FILE_CLONE=true"
            echo "CCACHE_INODE_CACHE=true"
            echo "CCACHE_IS_KERNEL_COMPILING=true"
            echo "CCACHE_UMASK=002"
            echo "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale"
          } >> "$GITHUB_ENV"

      - name: Prepare configuration
        id: config
        shell: bash
        env:
          USE_SUSFS: ${{ inputs.use_susfs }}
          USE_OPT_PATCHES: ${{ inputs.use_opt_patches }}
          LTO_MODE: ${{ inputs.lto }}
          COMPILER_MODE: ${{ inputs.compiler }}
          KERNEL_UNAME: ${{ inputs.kernel_uname }}
          NETHUNTER: ${{ inputs.nethunter }}
          WIRELESS_MODULES: ${{ inputs.wireless_modules }}
          DDK: ${{ inputs.ddk }}
          DDK_INJECTION: ${{ inputs.ddk_injection }}
        run: |
          set -euo pipefail
          if [ "$COMPILER_MODE" = manifest ]; then
            zyc_compiler=''
          else
            zyc_compiler=$(jq -r '.zyc_compiler' "${{ matrix.config }}")
          fi

          # The DDK inputs can only turn a variant's DDK build off, never on:
          # only manifests carrying the Kleaf/Bazel projects can build it, and
          # only OP13-6.6.118 does today. Forcing it on elsewhere would fail
          # during Bazel's load phase with a far less obvious error.
          config_ddk=$(jq -r '.ddk // false' "${{ matrix.config }}")
          if [ "$config_ddk" != "true" ]; then
            ddk=false
            ddk_injection=false
          else
            ddk="$DDK"
            if [ "$ddk" = "true" ]; then
              ddk_injection="$DDK_INJECTION"
            else
              ddk_injection=false
            fi
          fi

          config_json=$(jq -c \
            --argjson susfs "$USE_SUSFS" \
            --argjson opt "$USE_OPT_PATCHES" \
            --argjson nethunter "$NETHUNTER" \
            --argjson wireless_modules "$WIRELESS_MODULES" \
            --argjson ddk "$ddk" \
            --argjson ddk_injection "$ddk_injection" \
            --arg lto "$LTO_MODE" \
            --arg zyc "$zyc_compiler" \
            --arg uname "$KERNEL_UNAME" \
            '.susfs = $susfs | .opt = $opt | .nethunter = $nethunter | .wireless_modules = $wireless_modules | .ddk = $ddk | .ddk_injection = $ddk_injection | .lto = $lto | .zyc_compiler = $zyc | .uname = $uname' \
            "${{ matrix.config }}")
          echo "config_json=$config_json" >> "$GITHUB_OUTPUT"
          jq . <<< "$config_json"

      - name: Resolve KernelSU ref
        id: ksu
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KSU_VARIANT: ${{ inputs.ksu_variant }}
          KSU_BRANCH: ${{ inputs.ksu_branch }}
        run: |
          set -euo pipefail
          if [ "$KSU_VARIANT" = KSUN ]; then
            owner=KernelSU-Next; name=KernelSU-Next; default_ref=dev
          else
            owner=tiann; name=KernelSU; default_ref=main
          fi
          ref="${KSU_BRANCH:-}"
          [ -n "$ref" ] || ref="$default_ref"

          query='query($owner: String!, $name: String!, $headRef: String!, $tagRef: String!, $objRef: String!) {
            repository(owner: $owner, name: $name) {
              hb: ref(qualifiedName: $headRef) { t: target { ... on Commit { o: oid } } }
              ht: ref(qualifiedName: $tagRef) { t: target { ... on Commit { o: oid } } }
              ho: object(expression: $objRef) { ... on Commit { o: oid } }
            }
          }'

          resolved=unknown
          for attempt in 1 2 3; do
            if result=$(gh api graphql -f query="$query" -f owner="$owner" -f name="$name" \
                  -f headRef="refs/heads/$ref" -f tagRef="refs/tags/$ref" -f objRef="$ref" 2>/dev/null) \
               && [ -n "$result" ]; then
              resolved=$(jq -r '.data.repository | (.hb.t.o // .ht.t.o // .ho.o // "unknown")' <<< "$result")
              break
            fi
            echo "::warning::GitHub API call failed (attempt $attempt/3); retrying in 5s"
            sleep 5
          done

          if [ "$resolved" = unknown ] || [ -z "$resolved" ]; then
            echo "::error::Could not resolve $KSU_VARIANT ref '$ref' in $owner/$name"
            exit 1
          fi

          echo "Resolved $KSU_VARIANT ref '$ref' -> $resolved"
          echo "ref=$resolved" >> "$GITHUB_OUTPUT"

      - name: Build kernel
        id: build
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.config.outputs.config_json }}
          ksu_type: ${{ inputs.ksu_variant }}
          ksu_branch_or_hash: ${{ steps.ksu.outputs.ref }}
          susfs_commit_hash_or_branch: ${{ inputs.susfs_branch }}
          build_timestamp: ${{ inputs.build_timestamp }}
          optimize_level: ${{ inputs.optimize_level }}
          clean: ${{ inputs.clean_build }}
          debug: ${{ inputs.debug }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  firmware:
    name: Nethunter Wireless Firmware
    runs-on: ubuntu-latest
    if: ${{ inputs.wireless_modules }}
    steps:
      - name: Download latest Nethunter firmware
        id: fetch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Fetching latest nullptr-t-oss/Nethunter-Wireless-Firmware release"

          RELEASE_JSON=$(gh api repos/nullptr-t-oss/Nethunter-Wireless-Firmware/releases/latest)
          TAG=$(jq -r '.tag_name' <<< "$RELEASE_JSON")
          ASSET_URL=$(jq -r '.assets[0].browser_download_url' <<< "$RELEASE_JSON")
          ASSET_NAME=$(jq -r '.assets[0].name' <<< "$RELEASE_JSON")

          echo "Latest release: $TAG"
          echo "Asset: $ASSET_NAME"
          echo "URL: $ASSET_URL"

          curl -fsSL -o "$ASSET_NAME" "$ASSET_URL"

          SHA256=$(sha256sum "$ASSET_NAME" | awk '{print $1}')
          echo "SHA256: $SHA256"

          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.fetch.outputs.asset_name }}
          path: ${{ steps.fetch.outputs.asset_name }}
          archive: false
          compression-level: 0
          retention-days: 90

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [build, firmware]
    if: ${{ inputs.release_type != 'none' && !cancelled() && needs.build.result == 'success' }}
    steps:
      # v8 is required, not v7: the build job uploads the ZIPs with
      # `archive: false`, and only v8 checks Content-Type before trying to
      # unzip a raw (already-zipped-by-us) download.
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Collect release files
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files

          # Artifacts uploaded with `archive: false` land as
          # release-artifacts/<artifact-name>/<file-name>. Flatten them,
          # copying any file that matches a release artifact pattern.
          find release-artifacts -type f \
            \( -name 'AK3_*.zip' -o -name 'kernel_modules_*.zip' \
               -o -name 'Nethunter-Wireless-Firmware*.zip' \) \
            -exec cp -n -- {} release-files/ \;

          echo "Release files:"
          ls -la release-files/

          if [ -z "$(ls -A release-files)" ]; then
            echo "::error::No release files were collected"
            exit 1
          fi

      - name: Prepare release body
        id: body
        shell: bash
        run: |
          set -euo pipefail

          {
            echo 'body<<RELEASE_BODY_EOF'
            echo "OnePlus 13 kernel builds for OxygenOS 15/16."
            echo
            echo "**Build configuration:**"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| KernelSU variant | ${{ inputs.ksu_variant }} |"
            echo "| SUSFS | ${{ inputs.use_susfs }} |"
            echo "| Nethunter inline configs | ${{ inputs.nethunter }} |"
            echo "| Wireless modules | ${{ inputs.wireless_modules }} |"
            echo "| Optimization | ${{ inputs.optimize_level }} |"
            echo "| LTO | ${{ inputs.lto }} |"
            echo "| Compiler source | ${{ inputs.compiler }} |"
            echo "| Variants | ${{ inputs.kernel_version }} |"
            echo
            echo "**Artifacts (SHA256):**"
            echo
            for f in release-files/*; do
              printf -- '- `%s`\n  - `%s`\n' "$(basename "$f")" "$(sha256sum "$f" | awk '{print $1}')"
            done
            echo
            echo "---"
            echo
            echo "Flash the \`AK3_*.zip\` for your exact kernel version in a custom recovery or with the KernelSU/KSU-Next flasher."
            echo
            echo "\`kernel_modules_*.zip\` holds the external Wi-Fi/CAN drivers (ath9k_htc, ath10k, mt76, rtw88, rt2800usb, zd1211rw, p54, carl9170, slcan, …) built as loadable modules."
            echo "They are built with \`CONFIG_MODVERSIONS=y\`, so a module ZIP is valid **only** for the exact matching kernel build in this same release."
            echo "OnePlus's stock mac80211 lacks symbols these drivers need, so unload the stock stack first and \`insmod\` the bundled \`cfg80211.ko\`/\`mac80211.ko\` before the driver — see EmberHeart's \`docs/drivers.md\`."
            echo
            echo "\`Nethunter-Wireless-Firmware*.zip\` is re-published unmodified from [nullptr-t-oss/Nethunter-Wireless-Firmware](https://github.com/nullptr-t-oss/Nethunter-Wireless-Firmware)."
            echo
            echo "This repository does not build \`boot.img\`, \`vendor_boot.img\`, \`vendor_dlkm.img\`, or \`system_dlkm.img\`."
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: op13-${{ github.run_number }}
          name: OnePlus 13 Build ${{ github.run_number }}
          generate_release_notes: false
          prerelease: ${{ inputs.release_type == 'prerelease' }}
          body: ${{ steps.body.outputs.body }}
          files: release-files/*
