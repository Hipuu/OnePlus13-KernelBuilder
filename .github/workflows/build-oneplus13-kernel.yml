name: Build OnePlus 13 Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      ksu_variant:
        description: KernelSU variant
        required: true
        type: choice
        options:
          - KSUN
          - KSU
        default: KSUN
      ksu_branch:
        description: KernelSU branch, tag, or commit (empty uses dev for KSUN, main for KSU)
        required: false
        type: string
        default: ''
      use_susfs:
        description: Enable SUSFS
        required: true
        type: boolean
        default: true
      susfs_branch:
        description: SUSFS branch or commit (empty auto-selects gki-android15-6.6)
        required: false
        type: string
        default: ''
      optimize_level:
        description: Compiler optimization
        required: true
        type: choice
        options:
          - O2
          - O3
        default: O2
      lto:
        description: Link-time optimization
        required: true
        type: choice
        options:
          - thin
          - full
          - none
        default: thin
      compiler:
        description: Clang toolchain source
        required: true
        type: choice
        options:
          - zycromerz-19
          - manifest
        default: zycromerz-19
      use_opt_patches:
        description: Apply WildKernels optimization patches
        required: true
        type: boolean
        default: true
      kernel_uname:
        description: Kernel uname suffix
        required: true
        type: string
        default: OP-WILD
      build_timestamp:
        description: Custom uname timestamp (empty uses current UTC time)
        required: false
        type: string
        default: ''
      clean_build:
        description: Build without restoring ccache
        required: true
        type: boolean
        default: false
      release_type:
        description: Publish the successful build
        required: true
        type: choice
        options:
          - none
          - prerelease
          - release
        default: none
      debug:
        description: Build modules and upload debug artifacts
        required: true
        type: boolean
        default: false

jobs:
  build:
    name: OnePlus 13 / A16 / Android 15-6.6
    runs-on: ubuntu-latest

    steps:
      - name: Checkout builder
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            aria2 git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 python-is-python3 python3-requests \
            ccache jq bc dos2unix kmod libdw-dev elfutils pigz zstd
          sudo apt-get clean

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail
          CACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          mkdir -p "$CACHE_DIR"
          {
            echo "CCACHE_DIR=$CACHE_DIR"
            echo "CCACHE_LOGFILE=$GITHUB_WORKSPACE/ccache.log"
            echo "CCACHE_MAXSIZE=12G"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            echo "CCACHE_NOHASHDIR=true"
            echo "CCACHE_COMPRESSION=true"
            echo "CCACHE_COMPRESSION_LEVEL=3"
            echo "CCACHE_DIRECT=true"
            echo "CCACHE_FILE_CLONE=true"
            echo "CCACHE_INODE_CACHE=true"
            echo "CCACHE_IS_KERNEL_COMPILING=true"
            echo "CCACHE_UMASK=002"
            echo "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale"
          } >> "$GITHUB_ENV"

      - name: Prepare OnePlus 13 configuration
        id: config
        shell: bash
        env:
          USE_SUSFS: ${{ inputs.use_susfs }}
          USE_OPT_PATCHES: ${{ inputs.use_opt_patches }}
          LTO_MODE: ${{ inputs.lto }}
          COMPILER_MODE: ${{ inputs.compiler }}
          KERNEL_UNAME: ${{ inputs.kernel_uname }}
        run: |
          set -euo pipefail
          if [ "$COMPILER_MODE" = manifest ]; then
            zyc_compiler=''
          else
            zyc_compiler=$(jq -r '.zyc_compiler' configs/OP13-6.6.89.json)
          fi
          config_json=$(jq -c \
            --argjson susfs "$USE_SUSFS" \
            --argjson opt "$USE_OPT_PATCHES" \
            --arg lto "$LTO_MODE" \
            --arg zyc "$zyc_compiler" \
            --arg uname "$KERNEL_UNAME" \
            '.susfs = $susfs | .opt = $opt | .lto = $lto | .zyc_compiler = $zyc | .uname = $uname' \
            configs/OP13-6.6.89.json)
          echo "config_json=$config_json" >> "$GITHUB_OUTPUT"
          jq . <<< "$config_json"

      - name: Resolve KernelSU ref
        id: ksu
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KSU_VARIANT: ${{ inputs.ksu_variant }}
          KSU_BRANCH: ${{ inputs.ksu_branch }}
        run: |
          set -euo pipefail
          # KernelSU-Next's setup.sh with no argument checks out the latest *tag*,
          # which lags the SUSFS patch set and leaves an unfixable kernel/Kconfig
          # reject. Upstream always passes an explicit ref, so do the same here.
          if [ "$KSU_VARIANT" = KSUN ]; then
            owner=KernelSU-Next; name=KernelSU-Next; default_ref=dev
          else
            owner=tiann; name=KernelSU; default_ref=main
          fi
          ref="${KSU_BRANCH:-}"
          [ -n "$ref" ] || ref="$default_ref"

          query='query($owner: String!, $name: String!, $headRef: String!, $tagRef: String!, $objRef: String!) {
            repository(owner: $owner, name: $name) {
              hb: ref(qualifiedName: $headRef) { t: target { ... on Commit { o: oid } } }
              ht: ref(qualifiedName: $tagRef) { t: target { ... on Commit { o: oid } } }
              ho: object(expression: $objRef) { ... on Commit { o: oid } }
            }
          }'

          resolved=unknown
          for attempt in 1 2 3; do
            if result=$(gh api graphql -f query="$query" -f owner="$owner" -f name="$name" \
                  -f headRef="refs/heads/$ref" -f tagRef="refs/tags/$ref" -f objRef="$ref" 2>/dev/null) \
               && [ -n "$result" ]; then
              resolved=$(jq -r '.data.repository | (.hb.t.o // .ht.t.o // .ho.o // "unknown")' <<< "$result")
              break
            fi
            echo "::warning::GitHub API call failed (attempt $attempt/3); retrying in 5s"
            sleep 5
          done

          if [ "$resolved" = unknown ] || [ -z "$resolved" ]; then
            echo "::error::Could not resolve $KSU_VARIANT ref '$ref' in $owner/$name"
            exit 1
          fi

          echo "Resolved $KSU_VARIANT ref '$ref' -> $resolved"
          echo "ref=$resolved" >> "$GITHUB_OUTPUT"

      - name: Build OnePlus 13 kernel
        id: build
        uses: ./.github/actions/build-kernel
        with:
          op_config_json: ${{ steps.config.outputs.config_json }}
          ksu_type: ${{ inputs.ksu_variant }}
          ksu_branch_or_hash: ${{ steps.ksu.outputs.ref }}
          susfs_commit_hash_or_branch: ${{ inputs.susfs_branch }}
          build_timestamp: ${{ inputs.build_timestamp }}
          optimize_level: ${{ inputs.optimize_level }}
          clean: ${{ inputs.clean_build }}
          debug: ${{ inputs.debug }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload raw kernel Image
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: Image_OP13_A16_${{ steps.build.outputs.kernel_version }}
          path: OP13-6.6.89/kernel_platform/common/out/arch/arm64/boot/Image
          archive: false
          compression-level: 0
          retention-days: 90

      - name: Create release
        if: ${{ inputs.release_type != 'none' && success() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: op13-${{ github.run_number }}
          name: OnePlus 13 ${{ steps.build.outputs.kernel_version }}
          generate_release_notes: false
          prerelease: ${{ inputs.release_type == 'prerelease' }}
          body: |
            OnePlus 13 kernel for OxygenOS 16.

            - Kernel base: ${{ steps.build.outputs.kernel_version }}
            - KernelSU variant: ${{ steps.build.outputs.ksu_type }}
            - KernelSU version: ${{ steps.build.outputs.ksu_version }}
            - SUSFS enabled: ${{ inputs.use_susfs }}
            - SUSFS version: ${{ steps.build.outputs.susfs_version }}
            - Optimization: ${{ inputs.optimize_level }}
            - LTO: ${{ inputs.lto }}
            - Compiler source: ${{ inputs.compiler }}
            - Image SHA256: `${{ steps.build.outputs.image_sha256 }}`
            - AnyKernel3 SHA256: `${{ steps.build.outputs.zip_sha256 }}`

            This repository does not build boot.img, vendor_boot.img, or DLKM images.
          files: |
            OP13-6.6.89/artifacts/${{ steps.build.outputs.zip_name }}
            OP13-6.6.89/kernel_platform/common/out/arch/arm64/boot/Image
