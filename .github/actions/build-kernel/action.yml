name: 'Build OnePlus Kernel with KernelSU Next'
description: 'Build the OnePlus 13 GKI Image with KernelSU, SUSFS, and WildKernels patches'

inputs:
  op_config_json:
    description: 'JSON string containing full device config'
    required: true
  ksu_type:
    description: 'Select KSU Type'
    required: true
  ksu_branch_or_hash:
    description: 'KSU branch or commit hash (empty = auto-detect by ksu_type)'
    required: false
    default: ""
  susfs_commit_hash_or_branch:
    description: 'SUSFS branch or commit hash (empty = auto-detect by kernel version)'
    required: false
    default: ""
  build_timestamp:
    description: 'Custom kernel build timestamp shown in uname -a (e.g. "Tue Feb 10 10:01:02 UTC 2026"). Leave empty to use the current build time.'
    required: false
    default: ''
  optimize_level:
    description: 'Compiler optimization level (O2 or O3)'
    required: false
    default: O2
  clean:
    description: 'Force clean build without ccache acceleration'
    required: false
    default: false
  debug:
    description: 'Enable dumping debug related artifacts'
    required: false
    default: false
  github_token:
    description: 'GitHub Token'
    required: true

outputs:
  kernel_version:
    description: 'Full kernel version string'
    value: ${{ steps.save_metadata.outputs.kernel_version }}
  ksu_version:
    description: 'KernelSU version number'
    value: ${{ steps.save_metadata.outputs.ksu_version }}
  ksu_type:
    description: 'KernelSU Variant'
    value: ${{ steps.save_metadata.outputs.ksu_type }}
  susfs_version:
    description: 'SUSFS version string'
    value: ${{ steps.save_metadata.outputs.susfs_version }}
  build_timestamp:
    description: 'Effective kernel build timestamp used in uname -a'
    value: ${{ steps.collect_stats.outputs.build_timestamp }}
  image_sha256:
    description: 'SHA256 hash of kernel Image'
    value: ${{ steps.collect_stats.outputs.image_sha256 }}
  zip_sha256:
    description: 'SHA256 hash of AnyKernel3 Zip'
    value: ${{ steps.create_zip.outputs.zip_sha256 }}
  warnings:
    description: 'Number of compiler warnings'
    value: ${{ steps.collect_stats.outputs.warnings_count }}
  build_time:
    description: 'Total build time in seconds'
    value: ${{ steps.collect_stats.outputs.build_time }}
  ccache_hit_rate:
    description: 'ccache hit rate percentage'
    value: ${{ steps.ccache_stats.outputs.hit_rate }}
  ccache_direct_rate:
    description: 'ccache direct hit rate percentage'
    value: ${{ steps.ccache_stats.outputs.direct_rate }}
  zip_name:
    description: 'Name of the generated flashable ZIP'
    value: ${{ steps.create_zip.outputs.zip_name }}
  image_path:
    description: 'Workspace-relative path to the built kernel Image'
    value: ${{ steps.create_zip.outputs.image_path }}
  artifacts_dir:
    description: 'Workspace-relative path to the artifacts directory holding the ZIPs'
    value: ${{ steps.create_zip.outputs.artifacts_dir }}
  modules_zip_name:
    description: 'Name of the generated kernel modules ZIP (empty when wireless modules are disabled)'
    value: ${{ steps.create_modules_zip.outputs.modules_zip_name }}
  modules_zip_sha256:
    description: 'SHA256 hash of the kernel modules ZIP'
    value: ${{ steps.create_modules_zip.outputs.modules_zip_sha256 }}
  modules_count:
    description: 'Number of kernel modules packaged'
    value: ${{ steps.create_modules_zip.outputs.modules_count }}

runs:
  using: 'composite'
  steps:
    - name: Parse op_config_json
      shell: bash
      run: |
        set -euo pipefail
        echo '${{ inputs.op_config_json }}' > /tmp/config.json
        jq -r 'to_entries[] | "OP_\(.key | ascii_upcase)=\(.value)"' /tmp/config.json >> "$GITHUB_ENV"
        echo "Parsed config:"
        jq '.' /tmp/config.json

    - name: Validate Inputs
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Validate inputs"
        model="$OP_MODEL"
        soc="$OP_SOC"
        branch="$OP_BRANCH"
        manifest="$OP_MANIFEST"
        android_version="$OP_ANDROID_VERSION"
        kernel_version="$OP_KERNEL_VERSION"
        os_version="$OP_OS_VERSION"
        hmbird="$OP_HMBIRD"
        susfs="$OP_SUSFS"
        opt="$OP_OPT"
        bbg="$OP_BBG"
        bbr="$OP_BBR"
        bbr3="$OP_BBR3"
        ttl="$OP_TTL"
        ip_set="$OP_IP_SET"
        rust_build="$OP_RUST_BUILD"
        lto="$OP_LTO"
        uname="$OP_UNAME"
        unicode="$OP_UNICODE"
        c_compiler="$OP_C_COMPILER"
        rust_compiler="$OP_RUST_COMPILER"
        zyc_compiler="$OP_ZYC_COMPILER"
        bindgen="$OP_BINDGEN"
        ds="$OP_DS"
        ntsync="$OP_NTSYNC"
        blacklist_modules="$OP_BLACKLIST_MODULES"
        optimize='${{ inputs.optimize_level }}'

        errors=()

        if [[ -z "$model" ]]; then
          errors+=("Input 'model' cannot be empty")
        elif [[ ! "$model" =~ ^OP ]]; then
          errors+=("Input 'model' does not start with 'OP'. Got: '$model'")
        fi

        if [[ -z "$soc" ]]; then
          errors+=("Input 'soc' cannot be empty")
        elif [[ ! "$soc" =~ ^[A-Za-z0-9_-]+$ ]]; then
          errors+=("Input 'soc' contains invalid characters. Allowed: letters, digits, underscore, dash. Got: '$soc'")
        fi

        if [[ -z "$branch" ]]; then
          errors+=("Input 'branch' cannot be empty")
        elif [[ ! "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]; then
          errors+=("Input 'branch' contains invalid characters. Allowed: letters, digits, ., _, -, /. Got: '$branch'")
        fi

        if [[ -z "$manifest" ]]; then
          errors+=("Input 'manifest' cannot be empty")
        elif [[ "$manifest" == http*://* ]]; then
          if [[ ! "$manifest" =~ ^https:// ]]; then
            errors+=("Manifest URL must be HTTPS. Got: '$manifest'")
          fi
          if [[ ! "$manifest" =~ \.xml($|\?) ]]; then
            errors+=("Manifest URL should point to an XML file (.xml). Got: '$manifest'")
          fi
        else
          if [[ ! "$manifest" =~ \.xml$ ]]; then
            errors+=("Manifest filename must end with .xml. Got: '$manifest'")
          fi
          if [[ "$manifest" =~ [[:space:]] ]]; then
            errors+=("Manifest filename cannot contain spaces. Got: '$manifest'")
          fi
        fi

        if [[ -z "$android_version" ]]; then
          errors+=("Input 'android_version' cannot be empty")
        elif [[ ! "$android_version" =~ ^android[0-9]+$ ]]; then
          errors+=("Input 'android_version' contains invalid characters. Allowed: android followed by a number. Got: '$android_version'")
        fi

        if [[ -z "$kernel_version" ]]; then
          errors+=("Input 'kernel_version' cannot be empty")
        elif [[ ! "$kernel_version" =~ ^[0-9]+\.[0-9]+$ ]]; then
          errors+=("Input 'kernel_version' contains invalid characters. Allowed: number in X.Y format. Got: '$kernel_version'")
        fi

        if [[ -z "$os_version" ]]; then
          errors+=("Input 'os_version' cannot be empty")
        elif [[ ! "$os_version" =~ ^A ]]; then
          errors+=("Input 'os_version' does not start with 'A'. Got: '$os_version'")
        fi

        if [[ -z "$hmbird" ]]; then
          errors+=("Input 'hmbird' cannot be empty")
        elif [[ "$hmbird" != "true" && "$hmbird" != "false" ]]; then
          errors+=("Input 'hmbird' contains invalid characters. Allowed: 'true' or 'false'. Got: '$hmbird'")
        fi

        if [[ -z "$susfs" ]]; then
          errors+=("Input 'susfs' cannot be empty")
        elif [[ "$susfs" != "true" && "$susfs" != "false" ]]; then
          errors+=("Input 'susfs' contains invalid characters. Allowed: 'true' or 'false'. Got: '$susfs'")
        fi

        if [[ -z "$opt" ]]; then
          errors+=("Input 'opt' cannot be empty")
        elif [[ "$opt" != "true" && "$opt" != "false" ]]; then
          errors+=("Input 'opt' contains invalid characters. Allowed: 'true' or 'false'. Got: '$opt'")
        fi

        if [[ -z "$bbg" ]]; then
          errors+=("Input 'bbg' cannot be empty")
        elif [[ "$bbg" != "true" && "$bbg" != "false" ]]; then
          errors+=("Input 'bbg' contains invalid characters. Allowed: 'true' or 'false'. Got: '$bbg'")
        fi

        if [[ -z "$bbr" ]]; then
          errors+=("Input 'bbr' cannot be empty")
        elif [[ "$bbr" != "true" && "$bbr" != "false" ]]; then
          errors+=("Input 'bbr' contains invalid characters. Allowed: 'true' or 'false'. Got: '$bbr'")
        fi

        if [[ -z "$bbr3" ]]; then
          errors+=("Input 'bbr3' cannot be empty")
        elif [[ "$bbr3" != "true" && "$bbr3" != "false" ]]; then
          errors+=("Input 'bbr3' contains invalid characters. Allowed: 'true' or 'false'. Got: '$bbr3'")
        fi

        if [[ -z "$ttl" ]]; then
          errors+=("Input 'ttl' cannot be empty")
        elif [[ "$ttl" != "true" && "$ttl" != "false" ]]; then
          errors+=("Input 'ttl' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ttl'")
        fi

        if [[ -z "$ip_set" ]]; then
          errors+=("Input 'ip_set' cannot be empty")
        elif [[ "$ip_set" != "true" && "$ip_set" != "false" ]]; then
          errors+=("Input 'ip_set' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ip_set'")
        fi

        if [[ -z "$rust_build" ]]; then
          errors+=("Input 'rust_build' cannot be empty")
        elif [[ "$rust_build" != "true" && "$rust_build" != "false" ]]; then
          errors+=("Input 'rust_build' contains invalid characters. Allowed: 'true' or 'false'. Got: '$rust_build'")
        fi

        if [[ -z "$lto" ]]; then
          errors+=("Input 'lto' cannot be empty")
        elif [[ "$lto" != "none" && "$lto" != "thin" && "$lto" != "full" ]]; then
          errors+=("Input 'lto' contains invalid characters. Allowed: 'thin', 'full' or 'none'. Got: '$lto'")
        fi

        if [[ -z "$uname" ]]; then
          errors+=("Input 'uname' cannot be empty")
        elif [[ ${#uname} -gt 44 ]]; then
          errors+=("Input 'uname' too long. Maximum length: 44. Got: '$uname'")
        fi

        if [[ -z "$unicode" ]]; then
          errors+=("Input 'unicode' cannot be empty")
        elif [[ "$unicode" != "true" && "$unicode" != "false" ]]; then
          errors+=("Input 'unicode' contains invalid characters. Allowed: 'true' or 'false'. Got: '$unicode'")
        fi

        # OP_C_COMPILER currently has no checks!

        # OP_RUST_COMPILER currently has no checks!

        # OP_ZYC_COMPILER currently has no checks!

        # OP_BINDGEN currently has no checks!

        # OP_BLACKLIST_MODULES currently has no checks!

        if [[ -z "$ds" ]]; then
          errors+=("Input 'ds' cannot be empty")
        elif [[ "$ds" != "true" && "$ds" != "false" ]]; then
          errors+=("Input 'ds' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ds'")
        fi

        if [[ -z "$ntsync" ]]; then
          errors+=("Input 'ntsync' cannot be empty")
        elif [[ "$ntsync" != "true" && "$ntsync" != "false" ]]; then
          errors+=("Input 'ntsync' contains invalid characters. Allowed: 'true' or 'false'. Got: '$ntsync'")
        fi

        case "$optimize" in
          O2|O3) ;;
          *) errors+=("optimize_level must be O2 or O3. Got: '$optimize'"); ;;
        esac

        if [ ${#errors[@]} -ne 0 ]; then
          echo "Found ${#errors[@]} validation error(s):" >&2
          for error in "${errors[@]}"; do
            echo "  - $error" >&2
          done
          echo "::error::Input validation failed. See logs for details."
          exit 1
        else
          echo "✅ Input validation passed"
        fi
        echo "::endgroup::"

    - name: Setup Base Environment
      shell: bash
      run: |
        set -euo pipefail
        CONFIG="$OP_MODEL"
        echo "Creating folder for configuration: $CONFIG"
        mkdir -p "$CONFIG"
        echo "CONFIG=$CONFIG" >> "$GITHUB_ENV"
        REPO="/usr/local/bin/repo"
        if [ ! -x "$REPO" ]; then
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o "$REPO"
          chmod +x "$REPO"
        fi
        echo "REPO=$REPO" >> "$GITHUB_ENV"

    - name: Configure Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Free Disk Space
      shell: bash
      run: |
        set -euo pipefail
        sudo docker system prune -af &
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/lib/julia /usr/local/share/ghcup /usr/local/share/powershell /opt/az /opt/google /opt/hostedtoolcache &
        wait
        df -h /

    - name: Optimize Global Git for Repo Tool
      shell: bash
      run: |
        set -euo pipefail
        git config --global feature.manyFiles true
        git config --global core.fsmonitor true
        git config --global pack.sparse true
        git config --global http.sslVerify false

    - name: Sync Kernel Source
      id: sync-kernel-source
      uses: ./.github/actions/kernel-source-sync
      with:
        source_location: ${{ env.CONFIG }}
        github_token: ${{ inputs.github_token }}
        debug: ${{ inputs.debug }}

    - name: Set Dir Paths
      shell: bash
      run: |
        set -euo pipefail
        CONFIG_DIR="$GITHUB_WORKSPACE/$CONFIG"
        ARTIFACTS_DIR="$CONFIG_DIR/artifacts"
        KERNEL_PLATFORM_DIR="$CONFIG_DIR/kernel_platform"
        COMMON_KERNEL_DIR="$KERNEL_PLATFORM_DIR/common"
        MSM_KERNEL_DIR="$KERNEL_PLATFORM_DIR/msm-kernel"
        AK3_DIR="$CONFIG_DIR/AnyKernel3"
        DEBUG_ARTIFACTS_DIR="$GITHUB_WORKSPACE/debug_artifacts"
        KERNEL_PATCHES_DIR="$GITHUB_WORKSPACE/kernel_patches"
        SUSFS_DIR="$GITHUB_WORKSPACE/susfs4ksu"
        KSU_DIR="$KERNEL_PLATFORM_DIR/KernelSU"
        KSUN_DIR="$KERNEL_PLATFORM_DIR/KernelSU-Next"
        mkdir -p "$ARTIFACTS_DIR"
        mkdir -p "$DEBUG_ARTIFACTS_DIR"

        # Save to environment for later steps
        echo "CONFIG_FOLDER=$CONFIG_DIR" >> "$GITHUB_ENV"
        echo "ARTIFACTS_FOLDER=$ARTIFACTS_DIR" >> "$GITHUB_ENV"
        echo "KERNEL_PLATFORM_FOLDER=$KERNEL_PLATFORM_DIR" >> "$GITHUB_ENV"
        echo "COMMON_KERNEL_FOLDER=$COMMON_KERNEL_DIR" >> "$GITHUB_ENV"
        echo "MSM_KERNEL_FOLDER=$MSM_KERNEL_DIR" >> "$GITHUB_ENV"
        echo "AK3_FOLDER=$AK3_DIR" >> "$GITHUB_ENV"
        echo "DEBUG_ARTIFACTS_FOLDER=$DEBUG_ARTIFACTS_DIR" >> "$GITHUB_ENV"
        echo "KERNEL_PATCHES_FOLDER=$KERNEL_PATCHES_DIR" >> "$GITHUB_ENV"
        echo "SUSFS_FOLDER=$SUSFS_DIR" >> "$GITHUB_ENV"
        echo "KSU_FOLDER=$KSU_DIR" >> "$GITHUB_ENV"
        echo "KSUN_FOLDER=$KSUN_DIR" >> "$GITHUB_ENV"

        DEBUG_ZIP_NAME="debug_${OP_MODEL}_${OP_OS_VERSION}.zip"
        echo "DEBUG_ZIP_NAME=$DEBUG_ZIP_NAME" >> "$GITHUB_ENV"

    - name: Set Kernel build-tools to Path
      shell: bash
      run: |
        # Set Kernel build-tools to Path
        set -euo pipefail
        echo "${KERNEL_PLATFORM_FOLDER}/prebuilts/kernel-build-tools/linux-x86/bin/" >> $GITHUB_PATH
        echo "${KERNEL_PLATFORM_FOLDER}/prebuilts/kernel-build-tools/linux_musl-x86/bin/" >> $GITHUB_PATH

    - name: Get Kernel Version Info
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Get kernel version"
        cd "$COMMON_KERNEL_FOLDER"

        CONFIG_FILES=("build.config.common" "build.config.constants")
        BRANCH_LINE=""
        for f in "${CONFIG_FILES[@]}"; do
          if [ -f "$f" ]; then
            l=$(grep '^[[:space:]]*BRANCH=' "$f" || true)
            if [ -n "$l" ]; then BRANCH_LINE="$l"; break; fi
          fi
        done

        if [ -z "$BRANCH_LINE" ]; then
          echo "::error::No BRANCH= found in config files"; exit 1
        fi

        BRANCH_VALUE="${BRANCH_LINE#*=}"
        ANDROID_VERSION="${BRANCH_VALUE%-*}"

        if [ -z "$ANDROID_VERSION" ]; then
          echo "::error::Could not parse android version from BRANCH=$BRANCH_VALUE"
          exit 1
        fi

        VERSION=$(grep '^VERSION *=' Makefile | awk '{print $3}')
        PATCHLEVEL=$(grep '^PATCHLEVEL *=' Makefile | awk '{print $3}')
        SUBLEVEL=$(grep '^SUBLEVEL *=' Makefile | awk '{print $3}')
        FULL_VERSION="$VERSION.$PATCHLEVEL.$SUBLEVEL"

        cd "$ARTIFACTS_FOLDER"
        echo "$ANDROID_VERSION-$FULL_VERSION" > "${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "$OP_OS_VERSION" >> "${OP_MODEL}_${OP_OS_VERSION}.txt"

        {
          echo "ANDROID_VER=$ANDROID_VERSION"
          echo "KERNEL_VER=$VERSION.$PATCHLEVEL"
          echo "TKERNEL_VER=$FULL_VERSION"
          echo "KERNEL_FULL_VER=$ANDROID_VERSION-$FULL_VERSION"
          if [ "${{ env.OP_SUSFS }}" = true ]; then
            echo "SUSFS_KERNEL_BRANCH=gki-$ANDROID_VERSION-$VERSION.$PATCHLEVEL"
          fi
        } >> "$GITHUB_ENV"

        echo "✅ Detected: $ANDROID_VERSION-$FULL_VERSION"
        if [ "${{ env.OP_SUSFS }}" = true ]; then
          echo "   SUSFS Branch: gki-$ANDROID_VERSION-$VERSION.$PATCHLEVEL"
        fi
        echo "::endgroup::"

    - name: 🏷️ Set Build Identity (Hardcoded)
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Set build user/host"

        BUILD_USER="OnePlus"
        BUILD_HOST="ubuntu-build"

        echo "BUILD_USER=$BUILD_USER" >> "$GITHUB_ENV"
        echo "BUILD_HOST=$BUILD_HOST" >> "$GITHUB_ENV"

        echo ""
        echo "✅ Build identity configured:"
        echo "   User: $BUILD_USER"
        echo "   Host: $BUILD_HOST"
        echo "::endgroup::"

    - name: Check or Detect Clang
      shell: bash
      run: |
        # Check or Detect Clang
        set -euo pipefail
        echo "::group::Detect Clang"
        CLANG_FOUND=false
        CLANG_BIN=""

        if [ -n "$OP_ZYC_COMPILER" ]; then
          # Priority 1: User explicitly wants ZyC compiler
          echo "OP_ZYC_COMPILER detected as download link: $OP_ZYC_COMPILER"

          ZYC_DIR="$CONFIG_FOLDER/compiler/zyc"
          TEMP_TAR="$CONFIG_FOLDER/compiler.tar.gz"
          mkdir -p "$ZYC_DIR"

          echo "Downloading ZyC Clang from link..."

          max_retries=5
          attempt=1
          download_success=false

          while [ $attempt -le $max_retries ]; do
            echo "Download attempt $attempt/$max_retries..."

            if curl -L --fail --retry 3 --retry-delay 5 --connect-timeout 60 -o "$TEMP_TAR" "$OP_ZYC_COMPILER"; then
                echo "Download successful."
                download_success=true
                break
            else
                echo "Download failed (attempt $attempt)."
                rm -f "$TEMP_TAR" 2>/dev/null
                if [ $attempt -eq $max_retries ]; then
                    echo "Error: Failed to download ZyC Clang after $max_retries attempts."
                    break
                fi
                attempt=$((attempt + 1))
                sleep 8
            fi
          done

          if [ "$download_success" = true ]; then
            # Extract
            echo "Extracting to $ZYC_DIR ..."
            if tar -xzf "$TEMP_TAR" -C "$ZYC_DIR" 2>/dev/null; then
              # Symlink extraction fix
              tar -xzf "$TEMP_TAR" -C "$ZYC_DIR" 2>/dev/null || true
              # Cleanup
              rm -f "$TEMP_TAR"

              # Verify clang exists
              if [ -x "$ZYC_DIR/bin/clang" ]; then
                  CLANG_BIN="$ZYC_DIR/bin"
                  CLANG_FOUND=true
                  echo "ZyC Clang successfully downloaded and extracted."
                  echo "Using: $CLANG_BIN/clang"
              else
                  echo "Warning: Extraction done, but clang binary not found at $ZYC_DIR/bin/clang"
              fi
            else
                echo "Error: Failed to extract the tar.gz file."
                rm -f "$TEMP_TAR"
            fi
          fi

        elif [ -n "$OP_C_COMPILER" ]; then
          # Priority 2: User specified a custom C compiler
          if [ -x "$CONFIG_FOLDER/$OP_C_COMPILER/clang" ]; then
            CLANG_BIN="$CONFIG_FOLDER/$OP_C_COMPILER"
            CLANG_FOUND=true
          else
            echo "Warning: OP_C_COMPILER='$OP_C_COMPILER' but clang binary not found at $CONFIG_FOLDER/$OP_C_COMPILER/clang"
          fi
        fi

        if [ "$CLANG_FOUND" = false ]; then
          # Priority 3: Auto-detect from prebuilts (when both variables are empty / user clang not found)
          for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
            [ -d "$base/clang/host/linux-x86" ] || continue
            latest=$(ls -d "$base/clang/host/linux-x86/clang-r"* 2>/dev/null | sort -V | tail -n1 || true)
            if [ -n "$latest" ] && [ -x "$latest/bin/clang" ]; then
              CLANG_BIN="$latest/bin"
              CLANG_FOUND=true
              break
            fi
          done
        fi

        if [ "$CLANG_FOUND" = false ] && command -v clang >/dev/null 2>&1; then
          # Priority 4: Fallback to system-installed clang
          CLANG_BIN="$(dirname "$(command -v clang)")"
          CLANG_FOUND=true
          echo "Using system clang."
        fi

        [ "$CLANG_FOUND" = true ] || { echo "::error::No clang toolchain found"; exit 1; }

        echo "CLANG_BIN_PATH=$CLANG_BIN" >> "$GITHUB_ENV"

        CLANG_VERSION="$("$CLANG_BIN/clang" --version | head -n1)"
        echo "CLANG_VERSION=$CLANG_VERSION" >> "$GITHUB_ENV"

        echo "Derive Clang fingerprint"

        short="$("${CLANG_BIN}/clang" --version | sed -n '1s/.*clang-r\([0-9.]\+\).*/\1/p')"

        if [ -z "$short" ]; then
          short="$("${CLANG_BIN}/clang" --version | sha256sum | cut -c1-8)"
          echo "⚠️ Could not extract clang-r version, using hash: $short"
        else
          echo "✅ Clang version fingerprint: $short"
        fi

        echo "CLANG_VERSION_SHORT=$short" >> "$GITHUB_ENV"
        echo "$CLANG_BIN" >> $GITHUB_PATH
        echo "LIBCLANG_PATH=$CLANG_BIN/../lib" >> "$GITHUB_ENV"

        echo "✅ Detected Clang: $CLANG_VERSION"
        echo "::endgroup::"

    - name: Check or Detect Rust & bindgen
      shell: bash
      if: ${{ env.OP_RUST_BUILD == 'true' }}
      run: |
        # Check or Detect Rust & bindgen
        set -euo pipefail
        echo "::group::Detect Rust & bindgen"
        RUSTC_FOUND=false
        BINDGEN_FOUND=false

        if [ -z "$OP_RUST_COMPILER" ]; then
          for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
            [ -d "$base/rust/linux-x86" ] || continue
            latest=$(ls -d "$base/rust/linux-x86/1."* 2>/dev/null | sort -V | head -n1 || true)
            if [ -n "$latest" ] && [ -x "$latest/bin/rustc" ]; then
              RUSTC_BIN="$latest/bin"
              RUSTC_FOUND=true
              break
            fi
          done
        else
          if [ -x "$CONFIG_FOLDER/$OP_RUST_COMPILER/rustc" ]; then
            RUSTC_BIN="$CONFIG_FOLDER/$OP_RUST_COMPILER"
            RUSTC_FOUND=true
          fi
        fi

        if [ -z "$OP_BINDGEN" ]; then
          for base in "$KERNEL_PLATFORM_FOLDER/prebuilts" "$KERNEL_PLATFORM_FOLDER/prebuilts-master"; do
            [ -d "$base/clang-tools/linux-x86" ] || continue
            if [ -x "$base/clang-tools/linux-x86/bin/bindgen" ]; then
              BINDGEN_BIN="$base/clang-tools/linux-x86/bin"
              BINDGEN_FOUND=true
              chmod +x "$base/clang-tools/linux-x86/bin/bindgen"
              break
            fi
          done
        else
          if [ -x "$CONFIG_FOLDER/$OP_BINDGEN/bindgen" ]; then
            BINDGEN_BIN="$CONFIG_FOLDER/$OP_BINDGEN"
            BINDGEN_FOUND=true
            chmod +x "$CONFIG_FOLDER/$OP_BINDGEN/bindgen"
          fi
        fi

        [ "$RUSTC_FOUND" = true ] || { echo "::error::No RUST toolchain found"; exit 1; }
        [ "$BINDGEN_FOUND" = true ] || { echo "::warning::No bindgen found"; }

        echo "RUSTC_BIN_PATH=$RUSTC_BIN" >> "$GITHUB_ENV"
        RUSTC_VERSION="$("$RUSTC_BIN/rustc" --version | head -n1)"
        echo "RUSTC_VERSION=$RUSTC_VERSION" >> "$GITHUB_ENV"
        echo "RUSTC=$RUSTC_BIN/rustc" >> "$GITHUB_ENV"
        echo "$RUSTC_BIN" >> $GITHUB_PATH
        echo "✅ Detected RUSTC: $RUSTC_VERSION"

        if [ "$BINDGEN_FOUND" = true ]; then
          echo "BINDGEN_BIN_PATH=$BINDGEN_BIN" >> "$GITHUB_ENV"
          BINDGEN_VERSION="$("$BINDGEN_BIN/bindgen" --version | head -n1)"
          echo "BINDGEN_VERSION=$BINDGEN_VERSION" >> "$GITHUB_ENV"
          echo "$BINDGEN_BIN" >> $GITHUB_PATH
          echo "BINDGEN=$BINDGEN_BIN/bindgen" >> "$GITHUB_ENV"
          echo "✅ Detected BINDGEN: $BINDGEN_VERSION"
        fi

        echo "::endgroup::"

    - name: Install bindgen only (no rustc)
      shell: bash
      if: ${{ env.OP_RUST_BUILD == 'true'  && !env.BINDGEN_BIN_PATH }}
      run: |
        # Install bindgen via cargo (no full rustc needed)
        set -euo pipefail
        echo "::group::Install bindgen only (no rustc)"
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
        source $HOME/.cargo/env

        # Install bindgen CLI only (~50-100MB total)
        cargo install bindgen-cli --version 0.69.5

        BINDGEN=$(which bindgen)
        BINDGEN_BIN=$(dirname $BINDGEN)
        echo "$BINDGEN_BIN" >> $GITHUB_PATH
        echo "BINDGEN=$BINDGEN" >> "$GITHUB_ENV"

        # Verify
        bindgen --version
        echo "::endgroup::"

    - name: Test Rust & bindgen
      shell: bash
      if: ${{ env.OP_RUST_BUILD == 'true' }}
      run: |
        # Test Rust & bindgen
        set -euo pipefail
        echo "::group::Test Rust & bindgen"
        cd "$COMMON_KERNEL_FOLDER"
        export RUSTTARGET="aarch64-linux-android"
        make V=1 rustavailable
        echo "::endgroup::"

    - name: Restore ccache cache
      id: restore-ccache-cache
      uses: ./.github/actions/cache/restore
      if: ${{ inputs.clean == false || inputs.clean == 'false' }}
      with:
        cache_path: ${{ env.CCACHE_DIR }}
        cache_key: ${{ inputs.ksu_type }}-v3-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-${{ env.CLANG_VERSION_SHORT }}-${{ env.OP_LTO }}_LTO
        cache_bucket: "ccache-cache"
        debug: ${{ inputs.debug }}
        restore_keys: |
          ${{ inputs.ksu_type }}-v3-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-${{ env.CLANG_VERSION_SHORT }}-
          ${{ inputs.ksu_type }}-v3-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-
          ${{ inputs.ksu_type }}-v3-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-

    - name: Check and Prepare Caches
      shell: bash
      run: |
        echo "::group::Check ccache"
        set -euo pipefail

        echo "/usr/lib/ccache" >> $GITHUB_PATH

        echo "Current ccache configuration:"
        ccache -p

        if [ -d "$CCACHE_DIR" ] && find "$CCACHE_DIR" -maxdepth 2 -type f -print -quit 2>/dev/null | grep -q .; then
          echo "✅ Restored cache found"
          echo ""
          echo "Pre-build cache statistics:"
          ccache -s | head -n 20

          echo "Updating atime to achive cache eviction"
          find ${{ env.CCACHE_DIR }} -type f -exec touch -t $(date -d "1 day ago" +%Y%m%d%H%M) {} +
        else
          echo "⚠️ No existing cache - building from scratch"
          echo "Cache will be populated for future builds"
        fi

        ccache -z
        rm -f "$CCACHE_DIR/ccache.log"

        # Blacklist Risky files from ccache
        sed -i '1i // CI_RUN_ID: ${{ github.run_id }}' "$COMMON_KERNEL_FOLDER/kernel/configs.c"
        sed -i '1i // ccache:disable' "$COMMON_KERNEL_FOLDER/kernel/configs.c"

        if head -n 1 "$COMMON_KERNEL_FOLDER/kernel/configs.c" | grep -q "// ccache:disable"; then
            echo "Success: ccache is disabled for this file!"
        else
            echo "Error: Modification failed or line is missing."
        fi

        echo "::endgroup::"

    - name: Fetch SusFS and Other Dependencies
      shell: bash
      run: |
        echo "::group::Fetch dependencies"
        set -euo pipefail
        echo "Fetching SusFS and other dependencies..."


        if [ "${{ env.OP_SUSFS }}" = true ]; then
          # Determine SUSFS branch/commit to use
          SUSFS_INPUT="${{ inputs.susfs_commit_hash_or_branch }}"

          # Default SUSFS branches for each kernel version
          declare -A DEFAULT_SUSFS=(
            ["android12-5.10"]="gki-android12-5.10"
            ["android13-5.15"]="gki-android13-5.15"
            ["android14-6.1"]="gki-android14-6.1"
            ["android15-6.6"]="gki-android15-6.6"
            ["android16-6.12"]="gki-android16-6.12"
          )

          # Determine which SUSFS ref to use
          KERNEL_KEY="${{ env.ANDROID_VER }}-${{ env.KERNEL_VER }}"
          if [ -z "$SUSFS_INPUT" ]; then
            # use kernel-specific default
            SUSFS_BRANCH="${DEFAULT_SUSFS[$KERNEL_KEY]:-gki-android15-6.6}"
            echo "ℹ️  Using default SUSFS branch for $KERNEL_KEY: $SUSFS_BRANCH"
          else
            # 40-char hash or branch/commit passed directly
            SUSFS_BRANCH="$SUSFS_INPUT"
            echo "🔧 Using resolved SUSFS ref: $SUSFS_BRANCH"
          fi
        fi

        retry_fetch_archive() {
          local url="$1"
          local branch="${2:-main}"
          local max_attempts=3
          local attempt=1

          local repo_name=$(basename "$url" .git)
          local safe_branch=$(echo "$branch" | tr '/' '_')
          local archive_name="${repo_name}_${safe_branch}.tar.gz"
          local shm_path="/dev/shm/$archive_name"

          local nproc=$(nproc 2>/dev/null || echo 4)

          local aria_log_flags="--quiet --summary-interval=0"
          if [ "${{ inputs.debug }}" = "true" ]; then
              aria_log_flags="--summary-interval=5" # Show progress every 5s in debug
          fi

          local aria2_headers=(
            "--header=User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
            "--header=Accept: */*"
            "--header=Connection: keep-alive"
          )

          local download_url=""
          if [[ "$url" == *"github.com"* ]]; then
              download_url="${url%.git}/archive/refs/heads/${branch}.tar.gz"
          elif [[ "$url" == *"gitlab.com"* ]]; then
              download_url="${url%.git}/-/archive/${branch}/${repo_name}-${branch}.tar.gz"
          else
              echo "::error::Unsupported host: $url"
              return 1
          fi

          while [ $attempt -le $max_attempts ]; do
              echo " Attempt $attempt/$max_attempts: High-speed fetch for $repo_name ($branch)"

              if aria2c -x16 -s16 -j16 -k1M --retry-wait=2 --max-tries=5 -d "/dev/shm" -o "$archive_name" --allow-overwrite=true "${aria2_headers[@]}" $aria_log_flags "$download_url"; then
                  mkdir -p "$repo_name"
                  if tar -I "pigz -p $nproc -b 256" -x --record-size=1M -f "$shm_path" -C "$repo_name" --strip-components=1 --no-same-owner; then
                      echo "✅ Success: $repo_name synced"
                      rm -f "$shm_path"
                      return 0
                  fi
              fi

              echo "⚠️ Attempt $attempt failed, clearing RAM and retrying..."
              rm -rf "$repo_name" "$shm_path" 2>/dev/null
              sleep 5
              attempt=$((attempt + 1))
          done

          echo "::error::All attempts failed for $url"
          return 1
        }

        retry_clone() {
          local url="$1"
          local branch="${2:-main}"
          local depth="${3:-1}"
          local dir="$(basename "$url" .git)"
          local max_attempts=3
          local attempt=1

          # Build git clone args
          local clone_args=(--branch "$branch")
          if [ "$depth" != "0" ] && [ -n "$depth" ]; then
            clone_args+=(--depth "$depth")
          fi

          while [ $attempt -le $max_attempts ]; do
            echo "🔄 Attempt $attempt/$max_attempts: cloning $url ($branch)${depth:+ [depth=$depth]}"

            # Clone with dynamic args
            git clone "${clone_args[@]}" "$url" "$dir" && {
              echo "✅ Success"
              return 0
            }

            echo "❌ Failed, cleaning up..."
            rm -rf "$dir" 2>/dev/null
            sleep $((attempt++ * 5))
          done

          echo "💥 All attempts failed"
          return 1
        }

        retry_clone "https://github.com/WildKernels/kernel_patches.git" "main" "1"

        if [ "${{ env.OP_SUSFS }}" = true ]; then
          echo "Using SUSFS branch/commit: $SUSFS_BRANCH"
          if ! retry_fetch_archive "https://gitlab.com/simonpunk/susfs4ksu.git" "$SUSFS_BRANCH"; then
            echo "::error::Failed to fetch SUSFS archive after multiple attempts"
            exit 1
          fi
          echo "SUSFS_COMMIT_SHA=$SUSFS_BRANCH" >> $GITHUB_ENV
        fi
        echo "✅ Dependencies cloned"
        echo "::endgroup::"

    - name: Clean Up ABI Protected Exports
      shell: bash
      run: |
        echo "::group::Clean Up ABI Protected Exports"
        set -euo pipefail
        cd "$KERNEL_PLATFORM_FOLDER"
        rm -f common/android/abi_gki_protected_exports_* || true
        sed -i 's/protected_modules = \[.*\]/protected_modules = []/' common/modules.bzl || true
        echo "::endgroup::"

    - name: Add KernelSU Next
      shell: bash
      if: ${{ inputs.ksu_type == 'KSUN' }}
      run: |
        set -euo pipefail
        echo "::group::Add KernelSU Next"
        cd "$KERNEL_PLATFORM_FOLDER"
        echo "Adding KernelSU Next..."
        KSU_INPUT="${{ inputs.ksu_branch_or_hash }}"
        if [ -z "$KSU_INPUT" ]; then
          curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -
        else
          curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -s "$KSU_INPUT"
        fi
        git submodule update --init --recursive
        cd KernelSU-Next/kernel

        COMMITS_COUNT=$(/usr/bin/git rev-list --count HEAD)

        if [ $COMMITS_COUNT -lt 2684 ]; then
          BASE_VERSION=10200
        else
          BASE_VERSION=30000
        fi

        KSU_VERSION=$(expr $COMMITS_COUNT "+" $BASE_VERSION)

        # KernelSU-Next moved version calculation from Makefile to Kbuild.
        # In Bazel/symlinked builds the git-root detection can fail, causing
        # KSU_VERSION to fall back to 1. Pin the values Kbuild will use.
        awk -v count="$COMMITS_COUNT" '
          /^# Calculate version if git version is available$/ {
            print "# --- version injected by build pipeline ---"
            print "KSU_GIT_VERSION := " count
            print "KSU_GIT_TAG := \"v0.0.1\""
            print "KSU_GIT_VERSION_VALID := 1"
            print ""
          }
          { print }
        ' Kbuild > Kbuild.tmp && mv Kbuild.tmp Kbuild

        if [ -f ksu.c ]; then
          sed -i 's/#if defined(CONFIG_STACKPROTECTOR) && (defined(CONFIG_ARM64) && !defined(CONFIG_STACKPROTECTOR_PER_TASK))/#if 0/' ksu.c
        fi

        if [[ "$KSU_VERSION" -gt 33095 ]] && [[ "${{ env.KERNEL_VER }}" == "6.12" ]]; then
          sed -i 's|ccflags-y += -I$(KSU_KERNEL_DIR) -I$(KSU_KERNEL_DIR)/include|ccflags-y += -I$(KSU_KERNEL_DIR) -I$(KSU_KERNEL_DIR)/include -I$(KSU_KERNEL_DIR)/include/uapi|' Kbuild
          sed -i 's|$(src)|$(abspath $(src))|' Kbuild
          sed -i 's|$(srctree)/$(src)|$(abspath $(srctree)/$(src))|' Kbuild
        fi

        if [ "$KSU_VERSION" -lt 12884 ]; then
          echo "NEED_HOOKS=true" >> $GITHUB_ENV
        else
          echo "NEED_HOOKS=false" >> $GITHUB_ENV
        fi

        cd ..
        KSU_COMMIT_SHA=$(git rev-parse HEAD)
        echo "KSU_COMMIT_SHA=$KSU_COMMIT_SHA" >> $GITHUB_ENV


        echo "Add KSUN Configuration Settings"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_KSU=y
        CONFIG_KSU_KPROBES_HOOK=n
        EOF

        echo "KSUN" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "$KSU_VERSION" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
        echo "KernelSU Next Version: $KSU_VERSION"
        echo "✅ KernelSU Next added (commit: ${KSU_COMMIT_SHA:0:8})"
        echo "::endgroup::"

    - name: Add KernelSU
      shell: bash
      if: ${{ inputs.ksu_type == 'KSU' }}
      run: |
        set -euo pipefail
        echo "::group::Add KernelSU"
        cd "$KERNEL_PLATFORM_FOLDER"
        echo "Adding KernelSU..."
        KSU_INPUT="${{ inputs.ksu_branch_or_hash }}"
        if [ -z "$KSU_INPUT" ]; then
          curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
        else
          curl --fail --location --proto '=https' -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "$KSU_INPUT"
        fi
        git submodule update --init --recursive
        cd KernelSU/kernel
        BASE_VERSION=30000
        COMMITS_COUNT=$(/usr/bin/git rev-list --count HEAD)
        KSU_VERSION=$(expr $COMMITS_COUNT "+" $BASE_VERSION)

        # KernelSU moved version calculation from Makefile to Kbuild.
        # Pin the values Kbuild will use so the driver reports the same version
        # as the build metadata.
        awk -v count="$COMMITS_COUNT" '
          /^# Calculate version if git version is available$/ {
            print "# --- version injected by build pipeline ---"
            print "KSU_GIT_VERSION := " count
            print "KSU_GIT_TAG := \"v0.0.1\""
            print "KSU_GIT_VERSION_VALID := 1"
            print ""
          }
          { print }
        ' Kbuild > Kbuild.tmp && mv Kbuild.tmp Kbuild

        if [ -f ksu.c ]; then
          sed -i 's/#if defined(CONFIG_STACKPROTECTOR) && (defined(CONFIG_ARM64) && !defined(CONFIG_STACKPROTECTOR_PER_TASK))/#if 0/' ksu.c
        fi

        if [[ "$KSU_VERSION" -gt 32427 ]] && [[ "${{ env.KERNEL_VER }}" == "6.12" ]]; then
          sed -i 's|ccflags-y += -I$(KSU_KERNEL_DIR) -I$(KSU_KERNEL_DIR)/include|ccflags-y += -I$(KSU_KERNEL_DIR) -I$(KSU_KERNEL_DIR)/include -I$(KSU_KERNEL_DIR)/include/uapi|' Kbuild
          sed -i 's|$(src)|$(abspath $(src))|' Kbuild
          sed -i 's|$(srctree)/$(src)|$(abspath $(srctree)/$(src))|' Kbuild
        fi

        echo "NEED_HOOKS=false" >> $GITHUB_ENV

        cd ..
        KSU_COMMIT_SHA=$(git rev-parse HEAD)
        echo "KSU_COMMIT_SHA=$KSU_COMMIT_SHA" >> $GITHUB_ENV

        echo "Add KSU Configuration Settings"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_KSU=y
        EOF

        echo "KSU" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "$KSU_VERSION" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
        echo "KernelSU Version: $KSU_VERSION"
        echo "✅ KernelSU added (commit: ${KSU_COMMIT_SHA:0:8})"
        echo "::endgroup::"

    - name: Apply SUSFS Patches
      shell: bash
      if: ${{ env.OP_SUSFS == 'true' }}
      run: |
        set -euo pipefail
        echo "::group::Apply SUSFS patches"
        cd "$KERNEL_PLATFORM_FOLDER"
        echo "Applying SUSFS patches..."
        cp "$SUSFS_FOLDER/kernel_patches/fs/"* "$COMMON_KERNEL_FOLDER/fs/"
        cp "$SUSFS_FOLDER/kernel_patches/include/linux/"* "$COMMON_KERNEL_FOLDER/include/linux/"

        susfs_version=$(grep '#define SUSFS_VERSION' "$COMMON_KERNEL_FOLDER/include/linux/susfs.h" | awk -F'"' '{print $2}')
        echo "SUSVER=$susfs_version" >> $GITHUB_ENV
        echo "$susfs_version" >> "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt"
        echo "SusFS Version: $susfs_version"

        # Function to compare semantic versions
        version_lte() {
          [ "$(printf '%s\n' "$2" "$1" | sort -V | head -n1)" = "$1" ]
        }

        if version_lte "${susfs_version:1}" "1.5.12"; then
          echo "NEED_HOOKS=true" >> $GITHUB_ENV
        else
          echo "NEED_HOOKS=false" >> $GITHUB_ENV
        fi

        case "$susfs_version" in
          "v1.5.8")
            if [ "${{ inputs.ksu_type }}" = "KSUN" ]; then
              patch -p1 --forward --fuzz=3 < "$SUSFS_FOLDER/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
              patch -p1 --forward --fuzz=3 < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/fix_apk_sign.c.patch"
              patch -p1 --forward --fuzz=3 < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/fix_core_hook.c.patch"
              patch -p1 --forward --fuzz=3 < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/fix_selinux.c.patch"
              patch -p1 --forward --fuzz=3 < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/fix_ksud.c.patch"
            else
              cd "$KSU_FOLDER"
              patch -p1 --forward --fuzz=3 < "$SUSFS_FOLDER/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
            fi
            ;;
          "v1.5.9"|"v1.5.10"|"v1.5.11"|"v1.5.12")
            if [ "${{ inputs.ksu_type }}" = "KSUN" ]; then
              cd "$KSUN_FOLDER"
              patch -p1 --forward < "$SUSFS_FOLDER/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
              for file in $(find ./kernel -maxdepth 2 -name "*.rej" -printf "%f\n" | cut -d'.' -f1); do
                echo "Patching file: $file.c with fix_$file.c.patch"
                patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/fix_$file.c.patch"
              done
              patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/fix_kernel_compat.c.patch"
            else
              cd "$KSU_FOLDER"
              patch -p1 --forward < "$SUSFS_FOLDER/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
            fi
            ;;
          "v2.0.0")
            if [ "${{ inputs.ksu_type }}" = "KSUN" ]; then
              cd "$KSUN_FOLDER"
              patch -p1 --forward < "$SUSFS_FOLDER/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
              for file in $(find ./kernel -maxdepth 2 -name "*.rej" -exec basename {} .rej \;); do
                echo "Patching file: $file with fix_$file.patch"
                patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/fix_$file.patch"
              done
              echo "Patching Hook Mode!"
              patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/overwrite_hook_mode.patch"
              echo "Patching KSU_TOOLKIT Support for SusFS kernel!"
              patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/ksu_toolkit.patch"
              if [ "$KSUVER" -le 33095 ]; then
                echo "Patching Multi-manager Support for SusFS kernel!"
                patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/multi_manager.patch"
              fi
              if [ "$KSUVER" -ge 33068 ] && [ "$KSUVER" -lt 33070 ]; then
                echo "Patching Multi-manager sepolicy Support for SusFS kernel!"
                patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/multi_sepolicy_fix.patch"
              fi
            else
              cd "$KSU_FOLDER"
              patch -p1 --forward < "$SUSFS_FOLDER/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
            fi
            ;;
          "v2.1.0")
            if [ "${{ inputs.ksu_type }}" = "KSUN" ]; then
              cd "$KSUN_FOLDER"
              patch -p1 --forward < "$SUSFS_FOLDER/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
              for file in $(find ./kernel -maxdepth 2 -name "*.rej" -exec basename {} .rej \;); do
                echo "Patching file: $file with fix_$file.patch"
                patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/fix_$file.patch"
              done
              echo "Patching Hook Mode!"
              patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/overwrite_hook_mode.patch"
              echo "Patching KSU_TOOLKIT Support for SusFS kernel!"
              patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/ksu_toolkit.patch"
              if [ "$KSUVER" -le 33095 ]; then
                echo "Patching Multi-manager Support for SusFS kernel!"
                patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/multi_manager.patch"
              fi
              if [ "$KSUVER" -ge 33068 ] && [ "$KSUVER" -lt 33070 ]; then
                echo "Patching Multi-manager sepolicy Support for SusFS kernel!"
                patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/multi_sepolicy_fix.patch"
              fi
            else
              cd "$KSU_FOLDER"
              patch -p1 --forward < "$SUSFS_FOLDER/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
            fi
            ;;
          "v2.2.0")
            if [ "${{ inputs.ksu_type }}" = "KSUN" ]; then
              cd "$KSUN_FOLDER"
              patch -p1 --forward < "$SUSFS_FOLDER/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
              for file in $(find ./kernel -maxdepth 2 -name "*.rej" -exec basename {} .rej \;); do
                echo "Patching file: $file with fix_$file.patch"
                patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/fix_$file.patch"
              done
              echo "Patching Hook Mode!"
              patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/overwrite_hook_mode.patch"
              echo "Patching KSU_TOOLKIT Support for SusFS kernel!"
              patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/next/susfs_fix_patches/$susfs_version/ksu_toolkit.patch"
            else
              cd "$KSU_FOLDER"
              patch -p1 --forward < "$SUSFS_FOLDER/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" || true
            fi
            ;;
          *)
            echo "::error::Unsupported SUSFS version: $susfs_version"
            exit 1
            ;;
        esac

        cd "$COMMON_KERNEL_FOLDER"
        if [ "${{ env.ANDROID_VER }}" = "android15" ] && [ "${{ env.KERNEL_VER }}" = "6.6" ]; then
          if ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c; then
            sed -i '/#include <trace\/hooks\/blk.h>/a #include <trace\/hooks\/fs.h>' ./fs/namespace.c
          fi
        fi

        # Backport __fold_filemap_fixup_entry for older android15-6.6 trees.
        # The SUSFS android15-6.6 patch calls it unconditionally in
        # show_map_vma(), but the OP13 6.6.30 common tree (f9c1a38) predates
        # it: page_size_compat there has neither the declaration nor the
        # definition, so the build dies with "call to undeclared function
        # '__fold_filemap_fixup_entry'". Every newer pin (6.6.56/66/89/118)
        # already carries it, hence the grep guard.
        if [ "${{ env.ANDROID_VER }}" = "android15" ] && [ "${{ env.KERNEL_VER }}" = "6.6" ] \
           && [ -f ./include/linux/page_size_compat.h ] \
           && ! grep -q '__fold_filemap_fixup_entry' ./include/linux/page_size_compat.h; then
          echo "__fold_filemap_fixup_entry absent. Backporting from upstream page_size_compat."
          sed -i -e '/^#endif \/\* __LINUX_PAGE_SIZE_COMPAT_H \*\//i struct vma_iterator;' \
                 -e '/^#endif \/\* __LINUX_PAGE_SIZE_COMPAT_H \*\//i extern void __fold_filemap_fixup_entry(struct vma_iterator *iter, unsigned long *end);' \
                 ./include/linux/page_size_compat.h
          printf '%s\n' \
            '' \
            'void __fold_filemap_fixup_entry(struct vma_iterator *iter, unsigned long *end)' \
            '{' \
            '    struct vm_area_struct *next_vma;' \
            '' \
            '    /* Not emulating page size? */' \
            '    if (!static_branch_unlikely(&page_shift_compat_enabled))' \
            '        return;' \
            '' \
            '    /* Advance iterator */' \
            '    next_vma = vma_next(iter);' \
            '' \
            '    /* If fixup VMA, adjust the end to cover its extent */' \
            '    if (next_vma && (next_vma->vm_flags & __VM_NO_COMPAT)) {' \
            '        *end = next_vma->vm_end;' \
            '        return;' \
            '    }' \
            '' \
            '    /* Rewind iterator */' \
            '    vma_prev(iter);' \
            '}' \
            >> ./mm/page_size_compat.c
        fi

        # The main SUSFS patch expects context some vendor kernels lack.
        # apply-susfs-main-patch.sh adds the missing context, dry-runs the
        # patch, applies it, and cleans up any temporary context.
        "$GITHUB_ACTION_PATH/files/apply-susfs-main-patch.sh" "${{ env.ANDROID_VER }}" "${{ env.KERNEL_VER }}" "${{ env.SUSFS_KERNEL_BRANCH }}"
        echo "✅ SUSFS patches applied"

        echo "Add SUSFS Configuration Settings"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_KSU_SUSFS=y
        CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_PATH=y
        CONFIG_KSU_SUSFS_SUS_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SUS_KSTAT=y
        CONFIG_KSU_SUSFS_SUS_OVERLAYFS=n
        CONFIG_KSU_SUSFS_TRY_UMOUNT=y
        CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
        CONFIG_KSU_SUSFS_SPOOF_UNAME=y
        CONFIG_KSU_SUSFS_ENABLE_LOG=y
        CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
        CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
        CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
        CONFIG_KSU_SUSFS_SUS_MAP=y
        CONFIG_KSU_SUSFS_SUS_SU=n
        EOF

        echo "::endgroup::"

    - name: Add BBG
      if: ${{ env.OP_BBG == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Add BBG LSM"
        cd "$KERNEL_PLATFORM_FOLDER"
        echo "Adding BBG..."
        if ! wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash -s main; then
          echo "::warning::BBG setup script failed, continuing anyway"
        fi
        echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig

        case "$OP_BRANCH" in
          wild/sm8850|wild/sm8845)
            echo "Applying BBG efisp abl whitelist patch"
            patch -p1 < "$KERNEL_PATCHES_FOLDER/common/bbg/0001-Enable-abl-and-efisp-flashing-for-efisp-exploit-devices.patch"
          ;;
        esac

        echo "✅ BBG LSM added"
        echo "::endgroup::"

    - name: Apply KSU Hooks
      shell: bash
      if: ${{ env.NEED_HOOKS == 'true' }}
      run: |
        set -euo pipefail
        echo "::group::Apply KSU hooks"
        cd "$COMMON_KERNEL_FOLDER"
        patch -p1 < "$KERNEL_PATCHES_FOLDER/next/scope_min_manual_hooks_v1.4.patch"
        echo "✅ KSU hooks applied"
        echo "::endgroup::"

    - name: Apply Other Patches
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply Other patches"
        cd "$COMMON_KERNEL_FOLDER"
        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        MIN_VERSION="5.16"
        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
          echo "Patching ptrace!"
          patch -p1 -F 3 < "$KERNEL_PATCHES_FOLDER/gki_ptrace.patch"
        else
          echo "Kernel >= $MIN_VERSION, skipping ptrace patch"
        fi

        if [ "$OP_HMBIRD" = true ]; then
          echo "Patching hmbird!"
          HMBIRD_MODEL=$(echo "$OP_MODEL" | sed 's/-[0-9]\+\.[0-9]\+\.[0-9]\+$//')
          case "$OP_MODEL" in
            OP-ACE-5-ULTRA-6.6.50|OP-ACE-5-PRO-6.6.30|OP13-6.6.30|OP13-6.6.66|OP13-CPH-6.6.56|OP13T-6.6.89|OP13-6.6.89|OP-ACE-5-PRO-6.6.89)
              # OP13-6.6.66 is a local variant with no upstream config; the only
              # fengchi_OP13_A15.patch in kernel_patches lives under deprecated/.
              FENGCHI_DIR="$KERNEL_PATCHES_FOLDER/oneplus/hmbird/deprecated" ;;
            *)
              FENGCHI_DIR="$KERNEL_PATCHES_FOLDER/oneplus/hmbird" ;;
          esac
          dos2unix "$FENGCHI_DIR/fengchi_${HMBIRD_MODEL}_${OP_OS_VERSION}.patch"
          patch -p1 -F 3 < "$FENGCHI_DIR/fengchi_${HMBIRD_MODEL}_${OP_OS_VERSION}.patch"
          # hmbird.c/hmbird_sched_proc.c call show_/store_scaling_governor, which
          # cpufreq.c exports but not every pinned common tree declares. The
          # OP13-CPH fengchi patch carries the declarations; fengchi_OP13_A15
          # does not, because the 6.6.30 tree it targets already has them.
          # The 6.6.66 tree (9920459) does not, so the build dies with
          # "call to undeclared function 'show_scaling_governor'". Add them here
          # when missing, guarded so trees that already declare them are untouched.
          if ! grep -q 'scaling_governor' ./include/linux/cpufreq.h; then
            echo "show_/store_scaling_governor undeclared. Adding prototypes to cpufreq.h."
            sed -i -e '/^struct cpufreq_cpuinfo {/i ssize_t store_scaling_governor(struct cpufreq_policy *policy, const char *buf, size_t count);' \
                   -e '/^struct cpufreq_cpuinfo {/i ssize_t show_scaling_governor(struct cpufreq_policy *policy, char *buf);' \
                   ./include/linux/cpufreq.h
          fi
          dos2unix "$KERNEL_PATCHES_FOLDER/oneplus/hmbird/overwriter.patch"
          patch -p1 -F 3 < "$KERNEL_PATCHES_FOLDER/oneplus/hmbird/overwriter.patch"
          chmod +x ./drivers/of/overwriter/overwrite_configs/convert_configs.sh
          dos2unix "$KERNEL_PATCHES_FOLDER/oneplus/hmbird/hmbird_config.patch"
          patch -p1 -F 3 < "$KERNEL_PATCHES_FOLDER/oneplus/hmbird/hmbird_config.patch"
        else
          echo "Hmbird not enabled, skipping fengchi patch"
        fi

        echo "Patching module intercept and overlay mechanism"
        patch -p1 < "$KERNEL_PATCHES_FOLDER/oneplus/module_overlay/0001-module-Add-module-intercept-and-overlay-mechanism-$ANDROID_VER-$KERNEL_VER.patch"
        if [ -d "$COMMON_KERNEL_FOLDER/kernel/module/module_overlay/" ]; then
          chmod +x ./kernel/module/module_overlay/convert_overlay.sh
        elif [ -d "$COMMON_KERNEL_FOLDER/kernel/module_overlay/" ]; then
          chmod +x ./kernel/module_overlay/convert_overlay.sh
        fi

        copied_modules=""
        SOC="${OP_BRANCH#*/}"

        declare -A selected_file=()
        declare -A selected_priority=()
        selected_count=0

        # Define suffixes in order of priority (1 to 7)
        suffixes=(
          "_${OP_MODEL}_${OP_OS_VERSION}_${KERNEL_FULL_VER}.ko"
          "_${SOC}_${OP_OS_VERSION}_${KERNEL_FULL_VER}.ko"
          "_${OP_MODEL}_${OP_OS_VERSION}.ko"
          "_${SOC}_${OP_OS_VERSION}.ko"
          "_${OP_MODEL}.ko"
          "_${SOC}.ko"
          "_${KERNEL_FULL_VER}.ko"
        )

        while IFS= read -r -d '' file; do
          filename="${file##*/}"
          module_name=""
          priority=0

          exact_module_name=$(modinfo -F name "$file" 2>/dev/null)

          # Evaluate priorities by iterating through the ordered suffixes
          for i in "${!suffixes[@]}"; do
            suffix="${suffixes[$i]}"
            if [[ "$filename" == *"$suffix" ]]; then
              extracted_name="${filename%"$suffix"}"
              extracted_normalized="${extracted_name//-/_}"

              if [[ "$extracted_normalized" == "$exact_module_name" ]]; then
                module_name="$extracted_name"
                priority=$((i + 1))
              fi

              break # Match found, stop checking lower priorities
            fi
          done

          # File did not match any supported naming pattern.
          [[ -n "$module_name" ]] || continue

          if [[ -z "${selected_priority[$module_name]+exists}" ]]; then
            echo "New module: $file"
            selected_file["$module_name"]="$file"
            selected_priority["$module_name"]="$priority"
            selected_count=$((selected_count + 1))
          elif (( priority < selected_priority["$module_name"] )); then
            echo "Existing module: $file ; replace with a higher-priority variant."
            selected_file["$module_name"]="$file"
            selected_priority["$module_name"]="$priority"
          fi
        done < <(find "$KERNEL_PATCHES_FOLDER/oneplus/module_overlay/modules/" -type f -name '*.ko' -print0)

        if (( selected_count == 0 )); then
          echo "No matching kernel modules found."
        fi

        for module_name in "${!selected_file[@]}"; do
          file="${selected_file[$module_name]}"
          priority="${selected_priority[$module_name]}"
          echo "Copying module '$module_name' priority=$priority: $file"

          dest_path=""
          if [ -d "$COMMON_KERNEL_FOLDER/kernel/module/module_overlay/modules/" ]; then
            dest_path="$COMMON_KERNEL_FOLDER/kernel/module/module_overlay/modules/${module_name}.ko"
          elif [ -d "$COMMON_KERNEL_FOLDER/kernel/module_overlay/modules/" ]; then
            dest_path="$COMMON_KERNEL_FOLDER/kernel/module_overlay/modules/${module_name}.ko"
          fi

          if [ -z "$dest_path" ]; then
            echo "::error::Module-overlay destination not found"
            exit 1
          fi
          cp -v -- "$file" "$dest_path"

          if [ -z "$copied_modules" ]; then
            copied_modules="$dest_path"
          else
            copied_modules="$copied_modules:$dest_path"
          fi
        done

        ccache --set-config=extra_files_to_hash="$copied_modules"

        echo "✅ Other patches applied"
        echo "::endgroup::"

    - name: Apply Optimisation Patches
      if: ${{ env.OP_OPT == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply Optimisation patches"
        cd "$COMMON_KERNEL_FOLDER"
        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        MIN_VERSION="5.16"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/optimized_mem_operations.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/file_struct_8bytes_align.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/reduce_cache_pressure.patch"

        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/mem_opt_prefetch.patch"

        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
          patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/optimise_memcmp.patch"
        elif [ "$(printf '%s\n' "$KERNEL_VERSION" "5.11" | sort -V | tail -n1)" = "$KERNEL_VERSION" ]; then
          sed -e 's/SYM_FUNC_START(__pi_memcmp)/SYM_FUNC_START_WEAK_PI(memcmp)/' -e 's/SYM_FUNC_END(__pi_memcmp)/SYM_FUNC_END_PI(memcmp)/' -e 's/SYM_FUNC_ALIAS_WEAK(memcmp, __pi_memcmp)/EXPORT_SYMBOL_NOKASAN(memcmp)/' "$KERNEL_PATCHES_FOLDER/common/optimise_memcmp.patch" | patch -p1 --forward
        else
          echo "Optimised memcmp patch not found!"
        fi
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/minimise_wakeup_time.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/int_sqrt.patch"
        if [ "$OP_BBR" != "true" ] && [ "$OP_BBR3" != "true" ]; then
          patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/force_tcp_nodelay.patch"
        else
          echo "Skipping force_tcp_nodelay (BBR/BBR3 enabled)"
        fi
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/reduce_gc_thread_sleep_time.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/add_timeout_wakelocks_globally.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/f2fs_reduce_congestion.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/reduce_freeze_timeout.patch"

        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
          patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/clear_page_16bytes_align.patch"
        else
          cat "$KERNEL_PATCHES_FOLDER/common/clear_page_16bytes_align.patch" | sed -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START_PI(__pi_clear_page)/' | patch -p1 -F3 --forward
        fi

        echo "Patching add_limitation_scaling_min_freq.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/add_limitation_scaling_min_freq.patch"
        echo "Patching re_write_limitation_scaling_min_freq.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/re_write_limitation_scaling_min_freq.patch"
        echo "Patching adjust_cpu_scan_order.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/adjust_cpu_scan_order.patch"
        echo "Patching avoid_extra_s2idle_wake_attempts.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/avoid_extra_s2idle_wake_attempts.patch"
        echo "Patching disable_cache_hot_buddy.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/disable_cache_hot_buddy.patch"
        echo "Patching f2fs_enlarge_min_fsync_blocks.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/f2fs_enlarge_min_fsync_blocks.patch"
        echo "Patching increase_ext4_default_commit_age.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/increase_ext4_default_commit_age.patch"
        echo "Patching increase_sk_mem_packets.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/increase_sk_mem_packets.patch"
        echo "Patching reduce_pci_pme_wakeups.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/reduce_pci_pme_wakeups.patch"
        echo "Patching silence_irq_cpu_logspam.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/silence_irq_cpu_logspam.patch"
        echo "Patching silence_system_logspam.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/silence_system_logspam.patch"
        echo "Patching use_unlikely_wrap_cpufreq.patch"
        patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/use_unlikely_wrap_cpufreq.patch"

        echo "✅ Optimisation Patches applied"
        echo "::endgroup::"

    - name: Apply battery optimization patches
      shell: bash
      if: success()
      run: |
        set -euo pipefail
        echo "::group::Apply battery optimization patches"
        BATTERY_PATCHES="$GITHUB_ACTION_PATH/files/battery"

        # A2: upstream hrtimer redundant-reprogram fix (stable ece8be21d8c93)
        cd "$COMMON_KERNEL_FOLDER"
        echo "Patching 0001-hrtimer-avoid-pointless-reprogramming.patch"
        patch -p1 --forward < "$BATTERY_PATCHES/0001-hrtimer-avoid-pointless-reprogramming.patch" || {
          echo "::warning::hrtimer reprogram patch did not apply cleanly; may already be present"
        }

        # A1: gate task-tracker hrtimer on tasktrack_enable (vendor module)
        if [ -d "$CONFIG_FOLDER/vendor/oplus/kernel/cpu/sched/sched_info" ]; then
          cd "$CONFIG_FOLDER/vendor/oplus/kernel/cpu/sched/sched_info"
          echo "Patching 0001-oplus-gate-tasktracker-timer-on-enable.patch"
          patch -p1 --forward < "$BATTERY_PATCHES/0001-oplus-gate-tasktracker-timer-on-enable.patch" || {
            echo "::warning::tasktrack timer gate patch did not apply; source may differ"
          }
        else
          echo "::warning::tasktrack source directory not found; skipping A1 patch"
        fi

        echo "✅ Battery optimization patches applied"
        echo "::endgroup::"

    - name: Apply NTSync Patch
      shell: bash
      if: ${{ env.OP_NTSYNC == 'true' }}
      run: |
        set -euo pipefail
        echo "::group::Apply NTSync patch"
        cd "$COMMON_KERNEL_FOLDER"
        NTSYNC_FOLDER="$KERNEL_PATCHES_FOLDER/common/ntsync"
        GKI_KEY="${ANDROID_VER}-${KERNEL_VER}"
        BRANCH_SUFFIX=$(basename "$OP_BRANCH")

        NTSYNC_PATCH=""
        case "$OP_MODEL" in
          OP10r|OP-ACE-2-5.10.209|OP-ACE-2V-5.10.209|OP-PAD-MT6983-5.10.209|\
          OP10pro-5.10.209|OP10t-5.10.209|OP-ACE-5.10.209|OP11r-5.10.209|\
          OP-NORD-3-5.10.209|OP-ACE-RACE-5.10.209)
            if [[ "$OP_OS_VERSION" == "A15" ]]; then
              NTSYNC_PATCH="$NTSYNC_FOLDER/ntsync_compat_android12-5.10_A14.patch"
            fi
            ;;
        esac
        if [ -n "$NTSYNC_PATCH" ]; then
          if [ ! -f "$NTSYNC_PATCH" ]; then
            echo "::error::NTSync compat patch not found for ${OP_MODEL}: $(basename $NTSYNC_PATCH)"
            exit 1
          fi
        elif [ -f "$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}_${OP_OS_VERSION}.patch" ]; then
          NTSYNC_PATCH="$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}_${OP_OS_VERSION}.patch"
        elif [ -f "$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}.patch" ]; then
          NTSYNC_PATCH="$NTSYNC_FOLDER/ntsync_compat_${GKI_KEY}.patch"
        else
          echo "::error::NTSync patch not found for ${GKI_KEY} (Model: ${OP_MODEL}, Android Version: ${OP_OS_VERSION})"
          exit 1
        fi

        echo "Using patch: $(basename $NTSYNC_PATCH)"
        if [ "$ANDROID_VER" = "android16" ] && [ "$KERNEL_VER" = "6.12" ]; then
          echo "Removing pre-existing ntsync files for android16-6.12"
          rm -f include/uapi/linux/ntsync.h
          rm -f drivers/misc/ntsync.c
        fi

        echo "Patching $(basename $NTSYNC_PATCH)!"
        patch -p1 --forward < "$NTSYNC_PATCH"
        echo "Patching ntsync_base!"
        patch -p1 --forward < "$NTSYNC_FOLDER/ntsync_base.patch"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_NTSYNC=y
        EOF
        echo "✅ NTSync patch applied"
        echo "::endgroup::"

    - name: Apply Unicode Fix Patch
      shell: bash
      if: ${{ env.OP_UNICODE == 'true' }}
      run: |
        set -euo pipefail
        echo "::group::Apply Unicode Fix patch"
        cd "$COMMON_KERNEL_FOLDER"
        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        MIN_VERSION="5.16"

        echo "Patching unicode!"
        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
            patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/unicode_bypass_fix_6.1-.patch"
        else
            patch -p1 --forward < "$KERNEL_PATCHES_FOLDER/common/unicode_bypass_fix_6.1+.patch"
        fi

    - name: Add Tmpfs Support
      shell: bash
      run: |
        set -euo pipefail
        echo "Add Tmpfs Support"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_TMPFS_XATTR=y
        CONFIG_TMPFS_POSIX_ACL=y
        EOF

    - name: Add BBR
      if: ${{ env.OP_BBR == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "Add BBR"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_TCP_CONG_ADVANCED=y
        CONFIG_TCP_CONG_BBR=y
        EOF

    - name: Apply BBRv3
      if: ${{ env.OP_BBR3 == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply BBRv3 patches"
        cd "$COMMON_KERNEL_FOLDER"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_TCP_CONG_ADVANCED=y
        CONFIG_TCP_CONG_BBR3=y
        EOF
        patch -p1 < "$KERNEL_PATCHES_FOLDER/common/bbrv3/0001-net-tcp-backport-BBRv3-to-$ANDROID_VER-$KERNEL_VER.patch"

        if [ "${{ env.ANDROID_VER }}" = "android12" ] && [ "${{ env.KERNEL_VER }}" = "5.10" ]; then
          if ! grep -qF 'int proc_dou8vec_minmax(' ./include/linux/sysctl.h; then
            patch -p1 < "$KERNEL_PATCHES_FOLDER/common/bbrv3/sysctl_add_proc_dou8vec_minmax.patch"
            patch -p1 < "$KERNEL_PATCHES_FOLDER/common/bbrv3/sysctl_fix_data-races_in_proc_dou8vec_minmax.patch"
          fi
        fi

        echo "✅ BBRv3 patches applied"
        echo "::endgroup::"

    - name: Enable Important Net Schedulers (qdisc)
      shell: bash
      run: |
        set -euo pipefail
        echo "Enable Important Net Schedulers (qdisc)"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_NET_SCH_FQ=y
        CONFIG_NET_SCH_FQ_CODEL=y
        CONFIG_NET_SCH_CAKE=y
        CONFIG_NET_SCH_PIE=y
        CONFIG_NET_SCH_FQ_PIE=y
        EOF

    - name: Add TTL Target Support
      if: ${{ env.OP_TTL == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "Add TTL Target Support"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_IP_NF_TARGET_TTL=y
        CONFIG_IP6_NF_TARGET_HL=y
        CONFIG_IP6_NF_MATCH_HL=y
        EOF

    - name: Add IP SET & IPv6_NAT Support
      if: ${{ env.OP_IP_SET == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "Add IP SET & IPv6_NAT Support"
        cd "$COMMON_KERNEL_FOLDER"
        KERNEL_VERSION="${{ env.KERNEL_VER }}"

        if [[ "$KERNEL_VERSION" == "6.12" ]] || [[ "$OP_BRANCH" == wild/mt* ]]; then
          echo "::debug::Skipping CONFIG_BPF_STREAM_PARSER for $KERNEL_VERSION / $OP_BRANCH"
        else
          echo "CONFIG_BPF_STREAM_PARSER=y" >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"
        fi

        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_IP_SET=y
        CONFIG_IP_SET_MAX=65534
        CONFIG_IP_SET_BITMAP_IP=y
        CONFIG_IP_SET_BITMAP_IPMAC=y
        CONFIG_IP_SET_BITMAP_PORT=y
        CONFIG_IP_SET_HASH_IP=y
        CONFIG_IP_SET_HASH_IPMARK=y
        CONFIG_IP_SET_HASH_IPPORT=y
        CONFIG_IP_SET_HASH_IPPORTIP=y
        CONFIG_IP_SET_HASH_IPPORTNET=y
        CONFIG_IP_SET_HASH_IPMAC=y
        CONFIG_IP_SET_HASH_MAC=y
        CONFIG_IP_SET_HASH_NETPORTNET=y
        CONFIG_IP_SET_HASH_NET=y
        CONFIG_IP_SET_HASH_NETNET=y
        CONFIG_IP_SET_HASH_NETPORT=y
        CONFIG_IP_SET_HASH_NETIFACE=y
        CONFIG_IP_SET_LIST_SET=y
        CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
        CONFIG_NETFILTER_XT_SET=y
        CONFIG_IP6_NF_NAT=y
        CONFIG_IP6_NF_TARGET_MASQUERADE=y
        EOF

    - name: Add Droidspaces support
      shell: bash
      if: ${{ env.OP_DS == 'true' }}
      run: |
        echo "::group::Add Droidspaces Support"
        set -euo pipefail
        cd "$COMMON_KERNEL_FOLDER"

        echo "Applying patch to enable SYSVIPC without breaking ABI"
        apply_patch() {
          local patch_file="$1"
          if patch -R -p1 -s -f --dry-run < "$patch_file" >/dev/null 2>&1; then
            echo "Already applied: $(basename "$patch_file")"
          else
            patch -p1 --forward < "$patch_file"
          fi
        }
        case "$OP_BRANCH" in
          wild/sm8850|wild/sm8845)
            apply_patch "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_a16-6.12.patch"
            ;;
          wild/sm8550|wild/sm7550)
            apply_patch "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_1_2_3.patch"
            ;;
          wild/sm8450|wild/sm8475|wild/mt6895|wild/mt6983|wild/mt6789)
            if [ "$ANDROID_VER" = "android12" ] && [ "$KERNEL_VER" = "5.10" ]; then
              apply_patch "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_bypass_a16-6.12_below.patch"
              apply_patch "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_abi_padding_for_posix_mqueue.patch"
            else
              apply_patch "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch"
            fi
            ;;
          *)
            apply_patch "$KERNEL_PATCHES_FOLDER/common/droidspaces/fix_sysvipc_kabi_6_7_8.patch"
            ;;
        esac

        echo "Patch to fix kernel panic caused by oplus_bsp_midas"
        apply_patch "$KERNEL_PATCHES_FOLDER/common/droidspaces/0001-Return-ghost-task-if-task-is-null-and-is-requested-b.patch"

        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_SYSVIPC=y
        CONFIG_DEVTMPFS=y
        CONFIG_PID_NS=y
        CONFIG_POSIX_MQUEUE=y
        CONFIG_NETFILTER_XT_TARGET_REJECT=y
        CONFIG_NETFILTER_XT_TARGET_LOG=y
        CONFIG_NETFILTER_XT_MATCH_RECENT=y
        CONFIG_USER_NS=y
        EOF

        if [ "${{ env.OP_RUST_BUILD }}" = "true" ]; then
          echo "Add IPC NS missing symbols for rust binder"
          if ! grep -q 'EXPORT_SYMBOL.*put_ipc_ns' "$COMMON_KERNEL_FOLDER/ipc/namespace.c"; then
            echo -e '\nEXPORT_SYMBOL_GPL(put_ipc_ns);' >> "$COMMON_KERNEL_FOLDER/ipc/namespace.c"
          fi
          if ! grep -q 'EXPORT_SYMBOL.*init_ipc_ns' "$COMMON_KERNEL_FOLDER/ipc/msgutil.c"; then
            echo -e '\nEXPORT_SYMBOL_GPL(init_ipc_ns);' >> "$COMMON_KERNEL_FOLDER/ipc/msgutil.c"
          fi
        fi

        echo "✅ Droidspaces Support applied"
        echo "::endgroup::"

    # Nethunter support, ported from nullptr-t-oss/EmberHeart_OnePlus11
    # (.github/kernel/action.yml "Add Nethunter inline configs"). These are
    # built into the Image; the external wireless drivers are separate and
    # handled by the "Add Nethunter wireless module configs" step below.
    - name: Add Nethunter inline configs
      if: ${{ env.OP_NETHUNTER == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Add Nethunter inline configs"
        cd "$COMMON_KERNEL_FOLDER"

        # Bluetooth, SDR (AirSpy/HackRF), CAN bus and USB-serial adapters.
        #
        # CONFIG_CAN, CONFIG_CAN_DEV, CONFIG_CAN_VCAN and the USB-serial core
        # are =m, not =y. GKI's module_outs for //common:kernel_aarch64 declares
        # net/can/{can,can-bcm,can-gw,can-raw}.ko,
        # drivers/net/can/{dev/can-dev,vcan}.ko and
        # drivers/usb/serial/{usbserial,ftdi_sio}.ko, and kernel_build fails if a
        # declared module is not produced. Building them in silently removed
        # them from the modules ZIP too, even though the packaging step seeds
        # from kernel/net/can and kernel/drivers/net/can and the README
        # documents slcan as loadable.
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_BT_HCIBTUSB=y
        CONFIG_BT_HCIBTUSB_BCM=y
        CONFIG_BT_HCIBTUSB_RTL=y
        CONFIG_BT_HCIVHCI=y
        CONFIG_BT_HCIBCM203X=y
        CONFIG_BT_HCIBPA10X=y
        CONFIG_BT_HCIBFUSB=y
        CONFIG_USB_AIRSPY=y
        CONFIG_USB_HACKRF=y
        CONFIG_CAN=m
        CONFIG_CAN_DEV=m
        CONFIG_CAN_CALC_BITTIMING=y
        CONFIG_CAN_LEDS=y
        CONFIG_CAN_VCAN=m
        CONFIG_CAN_GRCAN=m
        CONFIG_CAN_XILINXCAN=m
        CONFIG_CAN_C_CAN=m
        CONFIG_CAN_C_CAN_PLATFORM=m
        CONFIG_CAN_C_CAN_PCI=m
        CONFIG_CAN_CC770=m
        CONFIG_CAN_CC770_ISA=m
        CONFIG_CAN_CC770_PLATFORM=m
        CONFIG_CAN_M_CAN=m
        CONFIG_CAN_M_CAN_PCI=m
        CONFIG_CAN_M_CAN_PLATFORM=m
        CONFIG_CAN_M_CAN_TCAN4X5X=m
        CONFIG_CAN_HI311X=m
        CONFIG_CAN_MCP251X=m
        CONFIG_CAN_8DEV_USB=m
        CONFIG_CAN_EMS_USB=m
        CONFIG_CAN_ESD_USB2=m
        CONFIG_CAN_GS_USB=m
        CONFIG_CAN_KVASER_USB=m
        CONFIG_CAN_PEAK_USB=m
        CONFIG_NETLINK_DIAG=y
        CONFIG_VSOCKETS=y
        CONFIG_NET_SCHED=y
        CONFIG_NET_EMATCH_CANID=y
        CONFIG_USB_SERIAL=m
        CONFIG_USB_SERIAL_GENERIC=y
        CONFIG_USB_SERIAL_CH341=m
        CONFIG_USB_SERIAL_FTDI_SIO=m
        CONFIG_USB_SERIAL_PL2303=m
        EOF

        echo "✅ Nethunter inline configs added"
        echo "::endgroup::"

    # External Wi-Fi adapter drivers, ported from EmberHeart's
    # .github/kernel_modules/action.yml. Built as loadable modules (=m) and
    # shipped in a separate kernel_modules ZIP rather than in the Image, so
    # they can be insmod'd on demand.
    #
    # Non-DDK: append the full USB-adapter set to common/gki_defconfig and ship
    # a GKI-built cfg80211/mac80211 pair with them (platform CRCs differ).
    #
    # DDK: do NOT touch common/gki_defconfig for cfg80211/mac80211 --
    # //msm-kernel already builds those as in_tree_modules and adding a second
    # copy to GKI makes modpost fail with "wiphy_new_nm exported twice".
    # qca_cld3_<chipset>.ko is CRC-matched to the vendor pair, so that pair
    # stays authoritative. The full USB-adapter zoo (and AR9271) is instead
    # enabled on the *msm-kernel* gki_defconfig so every driver links against
    # the same mac80211 peach uses -- the same trick the ath9k_htc-only pack
    # pioneered. The pack then ships peach + vendor cfg/mac + the zoo; the
    # loader displaces peach while an external driver is up and keeps the
    # shared mac80211 CRCs.
    - name: Add Nethunter wireless module configs
      if: ${{ env.OP_NETHUNTER == 'true' && env.OP_WIRELESS_MODULES == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Add Nethunter wireless module configs"

        if [ "${OP_DDK:-false}" = "true" ]; then
          # Full USB zoo on the vendor kernel only: every driver links against
          # the vendor mac80211 that peach is CRC-matched to.
          MSM_DEF="$MSM_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"
          if [ ! -f "$MSM_DEF" ]; then
            echo "::error::msm-kernel gki_defconfig missing at $MSM_DEF"
            exit 1
          fi
          # Stock gki_defconfig carries "# CONFIG_<X> is not set" lines for the
          # wireless vendors and their drivers (plus CAN_SLCAN). A bare append
          # leaves both lines; strip every negation first so the merge_defconfig
          # path cannot keep a driver off, and drop any prior positive line so
          # re-runs stay idempotent.
          # HWMON and SPMI_MSM_PMIC_ARB are set =m by the vendor perf fragment;
          # stripping the base negations avoids merge "overridden config" aborts.
          STRIP_KEYS="
            WLAN_VENDOR_ATH ATH_COMMON ATH9K_HW ATH9K_COMMON ATH9K_HTC
            CARL9170 CARL9170_LEDS
            WLAN_VENDOR_REALTEK RTL_CARDS RTL8187 RTL8187_LEDS RTL8XXXU RTL8XXXU_UNTESTED
            RTW88 RTW88_CORE RTW88_USB RTW88_8821CU RTW88_8822BU RTW88_8822CU RTW88_8723DU
            WLAN_VENDOR_RALINK RT2X00 RT2X00_LIB RT2X00_USB
            RT2500USB RT73USB RT2800_LIB RT2800USB
            RT2800USB_RT33XX RT2800USB_RT35XX RT2800USB_RT3573
            RT2800USB_RT53XX RT2800USB_RT55XX RT2800USB_UNKNOWN
            WLAN_VENDOR_ZYDAS ZD1211RW
            WLAN_VENDOR_INTERSIL P54_COMMON P54_USB
            WLAN_VENDOR_MEDIATEK MT7601U MT76_CORE MT76_USB
            MT76x02_LIB MT76x02_USB MT76_CONNAC_LIB MT7603E
            MT76x2_COMMON MT76x0_COMMON MT76x0U MT76x2U
            MT7615_COMMON MT7915E MT7921_COMMON MT7921E MT7921U
            MAC80211_HWSIM EEPROM_93CX6 MAC80211_LEDS CAN_SLCAN
            HWMON SPMI_MSM_PMIC_ARB
          "
          for k in $STRIP_KEYS; do
            sed -i -e "/^# CONFIG_${k} is not set$/d" -e "/^CONFIG_${k}=/d" "$MSM_DEF"
          done
          # ATH9K_HTC, CARL9170 and RTL8187 select MAC80211_LEDS when LEDS_CLASS
          # is available (GKI already has LED class via flash/multicolor).
          # sun_perf.config hard-negates MAC80211_LEDS; that must flip to y or
          # check_merged fails with "MAC80211_LEDS n -> y".
          cat >> "$MSM_DEF" <<EOF
        # NetHunter external USB Wi-Fi zoo -- DDK path; links to vendor mac80211.
        # Mirrors the non-DDK append below minus the cfg80211/mac80211 cores:
        # those ship as vendor in_tree_modules and a GKI copy breaks modpost.
        # Keep this comment free of Kconfig-style tokens -- the merge
        # checker treats them as previous values and aborts the build.
        # Only prompt-having leaf drivers are listed here. Prompt-less
        # intermediates (_CORE/_LIB/_USB/_COMMON) get set through the
        # leaves' select chains; an explicit =m on an invisible symbol is
        # dropped by olddefconfig and check_merged_defconfig then aborts
        # with "-<SYMBOL> m".
        CONFIG_WLAN_VENDOR_ATH=y
        CONFIG_ATH9K_HTC=m
        CONFIG_CARL9170=m
        CONFIG_CARL9170_LEDS=y
        CONFIG_WLAN_VENDOR_REALTEK=y
        CONFIG_RTL8187=m
        CONFIG_RTL8187_LEDS=y
        CONFIG_RTL8XXXU=m
        CONFIG_RTL8XXXU_UNTESTED=y
        CONFIG_RTW88=m
        CONFIG_RTW88_8821CU=m
        CONFIG_RTW88_8822BU=m
        CONFIG_RTW88_8822CU=m
        CONFIG_RTW88_8723DU=m
        CONFIG_WLAN_VENDOR_RALINK=y
        CONFIG_RT2X00=m
        CONFIG_RT2500USB=m
        CONFIG_RT73USB=m
        CONFIG_RT2800USB=m
        CONFIG_RT2800USB_RT33XX=y
        CONFIG_RT2800USB_RT35XX=y
        CONFIG_RT2800USB_RT3573=y
        CONFIG_RT2800USB_RT53XX=y
        CONFIG_RT2800USB_RT55XX=y
        CONFIG_RT2800USB_UNKNOWN=y
        CONFIG_WLAN_VENDOR_ZYDAS=y
        CONFIG_ZD1211RW=m
        CONFIG_WLAN_VENDOR_INTERSIL=y
        # P54_USB *depends on* P54_COMMON (no select), so COMMON must be
        # listed explicitly; it has a prompt, so olddefconfig honors it.
        CONFIG_P54_COMMON=m
        CONFIG_P54_USB=m
        CONFIG_WLAN_VENDOR_MEDIATEK=y
        CONFIG_MT7601U=m
        CONFIG_MT7603E=m
        CONFIG_MT76x0U=m
        CONFIG_MT76x2U=m
        CONFIG_MT7915E=m
        CONFIG_MT7921E=m
        CONFIG_MT7921U=m
        CONFIG_MAC80211_HWSIM=m
        CONFIG_MAC80211_LEDS=y
        CONFIG_CAN_SLCAN=m
        EOF
          for k in CONFIG_WLAN_VENDOR_ATH CONFIG_ATH9K_HTC CONFIG_MAC80211_LEDS \
                   CONFIG_CARL9170 CONFIG_RTL8187 CONFIG_RTL8XXXU \
                   CONFIG_RTW88_8821CU CONFIG_RTW88_8822BU CONFIG_RTW88_8822CU \
                   CONFIG_RTW88_8723DU \
                   CONFIG_RT2X00 CONFIG_RT2500USB CONFIG_RT73USB CONFIG_RT2800USB \
                   CONFIG_ZD1211RW \
                   CONFIG_P54_COMMON CONFIG_P54_USB CONFIG_MT7601U CONFIG_MT7603E \
                   CONFIG_MT76x0U CONFIG_MT76x2U CONFIG_MT7915E \
                   CONFIG_MT7921E CONFIG_MT7921U CONFIG_MAC80211_HWSIM; do
            grep -q "^${k}=" "$MSM_DEF" || { echo "::error::$k missing after append"; exit 1; }
          done
          # Align vendor fragment so merge_config + check_merged_defconfig agree.
          SUN_PERF_CFG="$MSM_KERNEL_FOLDER/arch/arm64/configs/vendor/sun_perf.config"
          if [ -f "$SUN_PERF_CFG" ]; then
            sed -i \
              -e '/^# CONFIG_MAC80211_LEDS is not set$/d' \
              -e '/^CONFIG_MAC80211_LEDS=/d' \
              -e '/^# CONFIG_MAC80211_HWSIM is not set$/d' \
              -e '/^CONFIG_MAC80211_HWSIM=/d' \
              "$SUN_PERF_CFG"
            # Keep both near the other MAC80211 knobs if present. LEDS flips to
            # y (ath9k select); HWSIM ships as a module in the zoo while the
            # stock perf fragment hard-negates it.
            if grep -q '^CONFIG_MAC80211=' "$SUN_PERF_CFG"; then
              sed -i '/^CONFIG_MAC80211=/a CONFIG_MAC80211_LEDS=y\nCONFIG_MAC80211_HWSIM=m' "$SUN_PERF_CFG"
            else
              printf 'CONFIG_MAC80211_LEDS=y\nCONFIG_MAC80211_HWSIM=m\n' >> "$SUN_PERF_CFG"
            fi
            grep -q '^CONFIG_MAC80211_LEDS=y$' "$SUN_PERF_CFG" || {
              echo "::error::failed to set CONFIG_MAC80211_LEDS=y in sun_perf.config"
              exit 1
            }
            grep -q '^CONFIG_MAC80211_HWSIM=m$' "$SUN_PERF_CFG" || {
              echo "::error::failed to set CONFIG_MAC80211_HWSIM=m in sun_perf.config"
              exit 1
            }
            echo "Aligned sun_perf.config MAC80211_LEDS=y, MAC80211_HWSIM=m"
          else
            echo "::warning::sun_perf.config missing; relying on gki_defconfig only"
          fi
          echo "Appended external-driver zoo to msm-kernel gki_defconfig"

          # sun.bzl hardcodes in_tree_module_list. Kleaf only stages kos named
          # there (allow_undeclared_modules only stops the build from aborting).
          # Insert ath9k plus every zoo driver next to mac80211.
          SUN_BZL="$MSM_KERNEL_FOLDER/sun.bzl"
          if [ ! -f "$SUN_BZL" ]; then
            echo "::error::msm-kernel sun.bzl missing at $SUN_BZL"
            exit 1
          fi
          if grep -q 'ath9k_htc.ko' "$SUN_BZL"; then
            echo "sun.bzl already lists ath9k_htc"
          else
            ANCHOR='        "net/mac80211/mac80211.ko",'
            if [ "$(grep -cF "$ANCHOR" "$SUN_BZL")" -ne 1 ]; then
              echo "::error::expected exactly one mac80211.ko anchor in sun.bzl"
              grep -n 'mac80211.ko' "$SUN_BZL" || true
              exit 1
            fi
            # awk rewrite keeps the file intact; sed '\a' is less portable here
            awk -v a="$ANCHOR" '
              index($0, a) {
                print
                print "        \"drivers/net/wireless/ath/ath.ko\","
                print "        \"drivers/net/wireless/ath/ath9k/ath9k_hw.ko\","
                print "        \"drivers/net/wireless/ath/ath9k/ath9k_common.ko\","
                print "        \"drivers/net/wireless/ath/ath9k/ath9k_htc.ko\","
                print "        \"drivers/net/wireless/ath/carl9170/carl9170.ko\","
                print "        \"drivers/net/wireless/realtek/rtl818x/rtl8187/rtl8187.ko\","
                print "        \"drivers/misc/eeprom/eeprom_93cx6.ko\","
                print "        \"drivers/net/wireless/realtek/rtl8xxxu/rtl8xxxu.ko\","
                print "        \"drivers/net/wireless/realtek/rtw88/rtw88_core.ko\","
                print "        \"drivers/net/wireless/realtek/rtw88/rtw88_usb.ko\","
                print "        \"drivers/net/wireless/realtek/rtw88/rtw88_8821cu.ko\","
                print "        \"drivers/net/wireless/realtek/rtw88/rtw88_8822bu.ko\","
                print "        \"drivers/net/wireless/realtek/rtw88/rtw88_8822cu.ko\","
                print "        \"drivers/net/wireless/realtek/rtw88/rtw88_8723du.ko\","
                print "        \"drivers/net/wireless/ralink/rt2x00/rt2x00lib.ko\","
                print "        \"drivers/net/wireless/ralink/rt2x00/rt2x00usb.ko\","
                print "        \"drivers/net/wireless/ralink/rt2x00/rt2500usb.ko\","
                print "        \"drivers/net/wireless/ralink/rt2x00/rt73usb.ko\","
                print "        \"drivers/net/wireless/ralink/rt2x00/rt2800lib.ko\","
                print "        \"drivers/net/wireless/ralink/rt2x00/rt2800usb.ko\","
                print "        \"drivers/net/wireless/zydas/zd1211rw/zd1211rw.ko\","
                print "        \"drivers/net/wireless/intersil/p54/p54common.ko\","
                print "        \"drivers/net/wireless/intersil/p54/p54usb.ko\","
                print "        \"drivers/net/wireless/mediatek/mt76/mt76.ko\","
                print "        \"drivers/net/wireless/mediatek/mt76/mt76-usb.ko\","
                print "        \"drivers/net/wireless/mediatek/mt76/mt76x02-lib.ko\","
                print "        \"drivers/net/wireless/mediatek/mt76/mt76x02-usb.ko\","
                print "        \"drivers/net/wireless/mediatek/mt76/mt76-connac-lib.ko\","
                print "        \"drivers/net/wireless/mediatek/mt76/mt7603e.ko\","
                print "        \"drivers/net/wireless/mediatek/mt76/mt76x2-common.ko\","
                print "        \"drivers/net/wireless/mediatek/mt76/mt76x0-common.ko\","
                print "        \"drivers/net/wireless/mediatek/mt76/mt76x0u.ko\","
                print "        \"drivers/net/wireless/mediatek/mt76/mt76x2u.ko\","
                print "        \"drivers/net/wireless/mediatek/mt76/mt7615-common.ko\","
                print "        \"drivers/net/wireless/mediatek/mt76/mt7915e.ko\","
                print "        \"drivers/net/wireless/mediatek/mt76/mt7921-common.ko\","
                print "        \"drivers/net/wireless/mediatek/mt76/mt7921e.ko\","
                print "        \"drivers/net/wireless/mediatek/mt76/mt7921u.ko\","
                # 6.6 already keeps mac80211_hwsim under wireless/virtual/
                # (verified against the v6.6 Makefiles). The post-build guard
                # in Stage Bazel outputs fails loudly if a path is wrong.
                print "        \"drivers/net/wireless/virtual/mac80211_hwsim.ko\","
                next
              }
              { print }
            ' "$SUN_BZL" > "$SUN_BZL.tmp"
            mv "$SUN_BZL.tmp" "$SUN_BZL"
            echo "Patched sun.bzl in_tree_module_list with ath9k + external-driver zoo"
          fi
          grep -n 'ath9k_htc.ko\|mac80211.ko\|rt2800usb.ko' "$SUN_BZL" | head -10
        else
          cd "$COMMON_KERNEL_FOLDER"
          cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_CFG80211=m
        CONFIG_MAC80211=m
        CONFIG_MAC80211_LEDS=y
        CONFIG_WLAN_VENDOR_ATH=y
        CONFIG_ATH_COMMON=m
        CONFIG_ATH9K=m
        CONFIG_ATH9K_PCI=y
        CONFIG_ATH9K_AHB=y
        CONFIG_ATH9K_HW=m
        CONFIG_ATH9K_HTC=m
        CONFIG_ATH9K_COMMON=m
        CONFIG_ATH10K=m
        CONFIG_ATH10K_USB=m
        # No CONFIG_ATH11K: it depends on QCOM_QMI_HELPERS, which GKI does not
        # enable, so Kconfig drops it silently and no ath11k.ko is produced.
        # The hardware it drives is PCIe/AHB-attached anyway, not USB OTG.
        CONFIG_CARL9170=m
        CONFIG_CARL9170_LEDS=y
        CONFIG_WLAN_VENDOR_REALTEK=y
        CONFIG_RTL8187=m
        CONFIG_RTL8187_LEDS=y
        CONFIG_RTL8XXXU=m
        CONFIG_RTL8XXXU_UNTESTED=y
        CONFIG_RTW88=m
        CONFIG_RTW88_CORE=m
        CONFIG_RTW88_USB=m
        CONFIG_RTW88_8821CU=m
        CONFIG_RTW88_8822BU=m
        CONFIG_RTW88_8822CU=m
        CONFIG_RTW88_8723DU=m
        CONFIG_WLAN_VENDOR_RALINK=y
        CONFIG_RT2X00=m
        CONFIG_RT2500USB=m
        CONFIG_RT73USB=m
        CONFIG_RT2800USB=m
        CONFIG_RT2800USB_RT33XX=y
        CONFIG_RT2800USB_RT35XX=y
        CONFIG_RT2800USB_RT3573=y
        CONFIG_RT2800USB_RT53XX=y
        CONFIG_RT2800USB_RT55XX=y
        CONFIG_RT2800USB_UNKNOWN=y
        CONFIG_WLAN_VENDOR_ZYDAS=y
        CONFIG_ZD1211RW=m
        CONFIG_WLAN_VENDOR_INTERSIL=y
        CONFIG_P54_COMMON=m
        CONFIG_P54_USB=m
        CONFIG_WLAN_VENDOR_MEDIATEK=y
        CONFIG_MT7601U=m
        CONFIG_MT76_CORE=m
        CONFIG_MT76_USB=m
        CONFIG_MT76x02_LIB=m
        CONFIG_MT76x02_USB=m
        CONFIG_MT76_CONNAC_LIB=m
        CONFIG_MT7603E=m
        CONFIG_MT76x2_COMMON=m
        CONFIG_MT76x0_COMMON=m
        CONFIG_MT76x0U=m
        CONFIG_MT76x2U=m
        CONFIG_MT7615_COMMON=m
        CONFIG_MT7915E=m
        CONFIG_MT7921_COMMON=m
        CONFIG_MT7921E=m
        CONFIG_MT7921U=m
        CONFIG_MAC80211_HWSIM=m
        CONFIG_CAN_SLCAN=m
        EOF
        fi

        echo "✅ Nethunter wireless module configs added"
        echo "::endgroup::"

    # Out-of-tree rtw88 (lwfinger) replaces the in-tree copy, matching
    # EmberHeart. Pinned to a commit so the build stays reproducible.
    # Also skipped on the DDK path: rtw88 depends on mac80211, which is not
    # built for GKI there. See the note on the wireless module configs above.
    - name: Add out-of-tree rtw88 modules
      if: ${{ env.OP_NETHUNTER == 'true' && env.OP_WIRELESS_MODULES == 'true' && env.OP_RTW88_COMMIT != '' && env.OP_DDK != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Add out-of-tree rtw88"
        cd "$COMMON_KERNEL_FOLDER/drivers/net/wireless/realtek"

        rm -rf rtw88
        git clone --filter=blob:none --no-checkout https://github.com/lwfinger/rtw88.git rtw88
        git -C rtw88 fetch --depth=1 origin "$OP_RTW88_COMMIT"
        git -C rtw88 checkout --detach "$OP_RTW88_COMMIT"
        test "$(git -C rtw88 rev-parse HEAD)" = "$OP_RTW88_COMMIT"
        rm -rf rtw88/.git

        # The out-of-tree tree carries its own Kbuild wiring, so drop the
        # in-tree Kconfig source line and force the parent Makefile to build
        # it as a module.
        sed -i 's/$(CONFIG_RTW88)/m/g' Makefile
        sed -i '/^source "drivers\/net\/wireless\/realtek\/rtw88\/Kconfig"$/s/.*/ /' Kconfig

        echo "✅ out-of-tree rtw88 added at $OP_RTW88_COMMIT"
        echo "::endgroup::"

    - name: Add Build based configs
      shell: bash
      run: |
        set -euo pipefail
        echo "Add Build based configs"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
        CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3=n
        CONFIG_OPTIMIZE_INLINING=y
        CONFIG_FRAME_WARN=0
        CONFIG_TRACEPOINTS=y
        CONFIG_LRU_GEN_ENABLED=y
        EOF

    - name: Add RUST build configs
      shell: bash
      if: ${{ env.OP_RUST_BUILD == 'true' }}
      run: |
        set -euo pipefail
        echo "Add Build based configs"
        cat >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" <<EOF
        CONFIG_ANDROID_BINDER_IPC_RUST=m
        CONFIG_RUST=y
        EOF

    - name: Save Build Metadata
      id: save_metadata
      shell: bash
      run: |
        set -euo pipefail
        echo "Save Build Metadata"
        cd "$ARTIFACTS_FOLDER"
        echo "kernel_version=${{ env.KERNEL_FULL_VER }}" >> "$GITHUB_OUTPUT"
        echo "ksu_version=${KSUVER:-unknown}" >> "$GITHUB_OUTPUT"
        echo "ksu_type=${{ inputs.ksu_type }}" >> "$GITHUB_OUTPUT"
        if [ "${{ env.OP_SUSFS }}" = true ]; then
          echo "susfs_version=${SUSVER:-unknown}" >> "$GITHUB_OUTPUT"
        fi

    - name: Customize Kernel Branding
      shell: bash
      run: |
        set -euo pipefail
        echo "Customize Kernel Branding"
        cd "$COMMON_KERNEL_FOLDER"
        mkdir -p out
        CUSTOM_LOCALVERSION="-${ANDROID_VER}-${OP_UNAME}"
        echo "CUSTOM_LOCALVERSION=$CUSTOM_LOCALVERSION" >> "$GITHUB_ENV"

        # The make path applies this with `scripts/config --set-str LOCALVERSION`
        # in the Build Kernel step. Kleaf cannot: kernel_env hardcodes
        # `export LOCALVERSION=""` after the build config is sourced
        # (impl/stamp.bzl set_localversion_cmd), so an assignment in the build
        # config fragment is overwritten. Set CONFIG_LOCALVERSION in the
        # defconfig instead, which Kleaf builds from.
        #
        # Both trees need it. GKI builds from common/arch/arm64/configs/, and the
        # vendor kernel builds from msm-kernel/arch/arm64/configs/gki_defconfig
        # merged with vendor/sun_perf.config; each carries its own
        # CONFIG_LOCALVERSION="-4k". Branding only common/ gave an Image at
        # 6.6.118-android15-8-o-OP-WILD-4k with modules still built as
        # 6.6.118-android15-8-o-4k (run 31045666257) -- a vermagic mismatch,
        # which is worse than no branding: the modules would be refused at load.
        if [ "${OP_DDK:-false}" = "true" ]; then
          BRANDED=0
          for DEFCONFIG in \
            "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig" \
            "$MSM_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"; do
            [ -f "$DEFCONFIG" ] || { echo "[INFO] absent: $DEFCONFIG"; continue; }
            # Keep the stock "-4k" page-size marker; only prepend the branding.
            STOCK_LV="$(sed -n 's/^CONFIG_LOCALVERSION="\(.*\)"$/\1/p' "$DEFCONFIG" | head -1)"
            case "$STOCK_LV" in
              *"$OP_UNAME"*) echo "[INFO] already branded: $DEFCONFIG"; BRANDED=$((BRANDED+1)); continue ;;
            esac
            NEW_LV="-${OP_UNAME}${STOCK_LV}"
            sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"${NEW_LV}\"|" "$DEFCONFIG"
            if ! grep -qx "CONFIG_LOCALVERSION=\"${NEW_LV}\"" "$DEFCONFIG"; then
              echo "CONFIG_LOCALVERSION=\"${NEW_LV}\"" >> "$DEFCONFIG"
            fi
            echo "Branded ${DEFCONFIG#"$KERNEL_PLATFORM_FOLDER/"}: '${STOCK_LV}' -> '${NEW_LV}'"
            BRANDED=$((BRANDED+1))
          done
          if [ "$BRANDED" -lt 2 ]; then
            echo "::error::Expected to brand two defconfigs, branded $BRANDED"
            exit 1
          fi
        fi

    - name: Disable GPUEB
      shell: bash
      if: ${{ env.KERNEL_VER == '5.10' && (startsWith(env.OP_SOC, 'dimensity') || startsWith(env.OP_SOC, 'helio')) }}
      run: |
        set -euo pipefail
        echo "Disabling GPUEB for MTK kernel 5.10"
        sed -i '/obj-y.*gpueb/d' "$COMMON_KERNEL_FOLDER/drivers/gpu/mediatek/Makefile"

    - name: Apply Fake config.gz patch
      shell: bash
      run: |
        set -euo pipefail
        echo "Apply Fake config.gz patch"
        cd "$COMMON_KERNEL_FOLDER"
        patch -p1 < "$KERNEL_PATCHES_FOLDER/common/fake_config.patch"

        OPTIONS=()

        if [ "$OP_BBR" = "true" ] || [ "$OP_BBR3" = "true" ]; then
          OPTIONS+=("CONFIG_TCP_CONG_ADVANCED")
        fi

        if [ "$OP_IP_SET" = "true" ]; then
          OPTIONS+=("CONFIG_IP6_NF_NAT")
        fi

        CONFIG_STRING="${OPTIONS[*]}"
        echo "CONFIG_FAKE_DISABLE=${CONFIG_STRING}" >> $GITHUB_ENV

    - name: Disable Vendor / Kernel Modules
      shell: bash
      run: |
        set -euo pipefail
        echo "Disabling Vendor / Kernel Modules"
        cd "$COMMON_KERNEL_FOLDER"

        # Define modules that MUST NEVER be blacklisted
        RISKY_MODULES=("coresight" "rust_binder" "msm_kgsl" "camera" "oplusboot" "rmnet_wlan" "rmnet_core" "msm_drm" "cnss2" "oplus_chg_v2" "reboot_mode" "rfkill" "bootloader_log")

        declare -a modules=()
        IFS=',' read -ra ADDR <<< "$OP_BLACKLIST_MODULES"
        for mod in "${ADDR[@]}"; do
          [[ -n "$mod" ]] && modules+=("$mod")
        done

        if [ "$OP_BBR" = "true" ] || [ "$OP_BBR3" = "true" ]; then
          if [[ ! " ${modules[*]} " =~ " oplus_network_tuning " ]]; then
            modules+=("oplus_network_tuning")
          fi
          if [[ ! " ${modules[*]} " =~ " oplus_networks_tuning " ]]; then
            modules+=("oplus_networks_tuning")
          fi
        fi

        # Safety Validation Loop (Filter out risky modules)
        declare -a validated_modules=()
        for mod in "${modules[@]}"; do
          is_risky=false

          # Check if current module matches any risky module
          for risky in "${RISKY_MODULES[@]}"; do
            if [ "$mod" = "$risky" ]; then
              is_risky=true
              echo "⚠️ WARNING: Blocked attempt to blacklist protected module: $mod"
              break
            fi
          done

          # Only keep the module if it's safe
          if [ "$is_risky" = false ]; then
            validated_modules+=("$mod")
          fi
        done

        if [ ${#validated_modules[@]} -gt 0 ]; then
          RAW_JOINED=$(IFS=,; echo "${validated_modules[*]}")
          RESULT_LIST="\"${RAW_JOINED}\""
        else
          RESULT_LIST='""'
        fi

        echo "Disabling following kernel modules: ${RESULT_LIST}"

        echo "CONFIG_DEBLOAT_VENDOR_MODULES=${RESULT_LIST}" >> "$COMMON_KERNEL_FOLDER/arch/arm64/configs/gki_defconfig"

        KERNEL_VERSION="${{ env.KERNEL_VER }}"
        MIN_VERSION="5.16"
        if [ "$(printf '%s\n' "$KERNEL_VERSION" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VERSION" ]; then
          patch -p1 < "$KERNEL_PATCHES_FOLDER/common/vendor_modules/0001-Support-conditional-vendor-modules-blacklisting-5.15-and-below.patch"
        else
          patch -p1 < "$KERNEL_PATCHES_FOLDER/common/vendor_modules/0001-Support-conditional-vendor-modules-blacklisting-6.1-and-above.patch"
        fi

    - name: Apply qcacld monitor injection patch
      if: ${{ env.OP_DDK == 'true' && env.OP_DDK_INJECTION == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Apply qcacld monitor injection patch"

        QCACLD="$CONFIG_FOLDER/vendor/qcom/opensource/wlan/qcacld-3.0"
        QCACLD_PATCH="$GITHUB_ACTION_PATH/files/ddk/qcacld-monitor-injection.patch"

        if [ ! -d "$QCACLD" ]; then
          echo "::error::qcacld-3.0 not found at $QCACLD"
          exit 1
        fi
        cd "$QCACLD"
        # Capture dry-run output for debugging, but don't exit on failure yet
        if ! patch -p1 --fuzz=3 --dry-run < "$QCACLD_PATCH" > /tmp/inject_dryrun.log 2>&1; then
          echo "::error::monitor injection patch does not apply to this qcacld revision"
          cat /tmp/inject_dryrun.log | head -50 || true
          # Try with more fuzz as a last resort
          if ! patch -p1 --fuzz=10 --dry-run < "$QCACLD_PATCH" > /tmp/inject_dryrun2.log 2>&1; then
            echo "::error::patch also fails with fuzz=10"
            cat /tmp/inject_dryrun2.log | head -50 || true
            exit 1
          fi
          echo "::warning::patch applies with fuzz=10 but not fuzz=3"
        fi
        patch -p1 --fuzz=3 < "$QCACLD_PATCH"

        # Fail loudly if the Tx hook is not actually in place: a silently
        # unpatched driver looks identical until injection is tried on-device.
        if ! grep -q 'ndo_start_xmit = hdd_mon_hard_start_xmit' "$QCACLD/core/hdd/src/wlan_hdd_main.c"; then
          echo "::error::patch applied but .ndo_start_xmit hook is missing"
          exit 1
        fi
        if ! grep -q 'wmi_mgmt_unified_cmd_send' "$QCACLD/core/hdd/src/wlan_hdd_main.c"; then
          echo "::error::patch applied but direct WMI mgmt TX call is missing"
          exit 1
        fi
        if ! grep -q 'g_inj' "$QCACLD/core/hdd/src/wlan_hdd_main.c"; then
          echo "::error::patch applied but injection context struct is missing"
          exit 1
        fi
        if ! grep -q 'hdd_mon_inject_tx_complete' "$QCACLD/core/hdd/src/wlan_hdd_main.c"; then
          echo "::error::patch applied but hdd_mon_inject_tx_complete is missing"
          exit 1
        fi
        if ! grep -q 'hdd_mon_inject_tx_complete' "$QCACLD/core/wma/src/wma_mgmt.c"; then
          echo "::error::patch applied but WMA completion hook is missing"
          exit 1
        fi
        if ! grep -q 'hdd_mon_get_stats' "$QCACLD/core/hdd/src/wlan_hdd_main.c"; then
          echo "::error::patch applied but hdd_mon_get_stats is missing"
          exit 1
        fi
        if grep -q 'wmi_unified_vdev_up_send' "$QCACLD/core/hdd/src/wlan_hdd_main.c"; then
          echo "::error::injection path must not call VDEV_UP (firmware SSR)"
          exit 1
        fi


        # The injection hook lives in the monitor-mode net_device_ops, which are
        # only compiled when FEATURE_MONITOR_MODE_SUPPORT is enabled.
        # Bazel generates the effective defconfig from the SoC-named base files
        # (e.g. sun_gki_peach-v2_defconfig, sun_consolidate_peach-v2_defconfig),
        # not from the DDK target name (sun_perf -> sun_consolidate).
        for QCA_DEFCONFIG in \
          "configs/${{ env.OP_SOC }}_gki_${{ env.OP_DDK_CHIPSET }}_defconfig" \
          "configs/${{ env.OP_SOC }}_consolidate_${{ env.OP_DDK_CHIPSET }}_defconfig"; do
          if [ -f "$QCACLD/$QCA_DEFCONFIG" ]; then
            sed -i '/^# CONFIG_FEATURE_MONITOR_MODE_SUPPORT is not set/d' "$QCACLD/$QCA_DEFCONFIG"
            if ! grep -q '^CONFIG_FEATURE_MONITOR_MODE_SUPPORT=y' "$QCACLD/$QCA_DEFCONFIG"; then
              echo 'CONFIG_FEATURE_MONITOR_MODE_SUPPORT=y' >> "$QCACLD/$QCA_DEFCONFIG"
            fi
            echo "✅ Enabled FEATURE_MONITOR_MODE_SUPPORT in $QCA_DEFCONFIG"
          fi
        done

        echo "✅ Monitor injection patch applied"
        echo "::endgroup::"

    - name: Prepare Bazel/DDK build
      id: prepare_ddk
      if: ${{ env.OP_DDK == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Prepare Bazel/DDK build"

        # tools/bazel is a symlink to ../build/kernel/kleaf/bazel.sh, which execs
        # prebuilts/build-tools/path/linux-x86/python3. Both come from the
        # manifest; fail loudly rather than 20 minutes into a build.
        BAZEL_LAUNCHER="$KERNEL_PLATFORM_FOLDER/tools/bazel"
        BAZEL_BIN="$KERNEL_PLATFORM_FOLDER/prebuilts/kernel-build-tools/bazel/linux-x86_64/bazel"
        HERMETIC_PYTHON="$KERNEL_PLATFORM_FOLDER/prebuilts/build-tools/path/linux-x86/python3"

        MISSING=0
        for f in "$BAZEL_LAUNCHER" "$BAZEL_BIN" "$HERMETIC_PYTHON" \
                 "$KERNEL_PLATFORM_FOLDER/MODULE.bazel" \
                 "$MSM_KERNEL_FOLDER/BUILD.bazel" \
                 "$CONFIG_FOLDER/vendor/qcom/opensource/wlan/qcacld-3.0/BUILD.bazel"; do
          if [ ! -e "$f" ]; then
            echo "::error::Missing Bazel prerequisite: $f"
            MISSING=1
          fi
        done

        # MODULE.bazel names each of these with local_path_override /
        # new_kleaf_local_repository, so a missing one is a load-phase failure
        # with a far less obvious message.
        for d in external/bazel-skylib external/bazelbuild-apple_support \
                 external/bazelbuild-bazel-central-registry \
                 external/bazelbuild-platforms external/bazelbuild-rules_cc \
                 external/bazelbuild-rules_java external/bazelbuild-rules_license \
                 external/bazelbuild-rules_pkg external/bazelbuild-rules_python \
                 external/dtc external/libcap external/libcap-ng external/lz4 \
                 external/pigz external/python/absl-py external/toybox \
                 external/zlib external/zopfli prebuilts/ndk-r26 \
                 build/bazel_common_rules prebuilts/build-tools; do
          if [ ! -d "$KERNEL_PLATFORM_FOLDER/$d" ]; then
            echo "::error::Missing Bazel workspace dependency: kernel_platform/$d"
            MISSING=1
          fi
        done
        [ "$MISSING" -eq 0 ] || exit 1

        # The qcacld api/cmn symlinks are intra-repo and survive the tarball
        # sync, but a broken one silently drops every fw-api header.
        QCACLD="$CONFIG_FOLDER/vendor/qcom/opensource/wlan/qcacld-3.0"
        for l in api cmn; do
          if [ ! -d "$QCACLD/$l" ]; then
            echo "::error::qcacld-3.0/$l does not resolve (expected symlink to ../$( [ "$l" = api ] && echo fw-api || echo qca-wifi-host-cmn ))"
            ls -la "$QCACLD/$l" || true
            exit 1
          fi
        done

        install -d "$KERNEL_PLATFORM_FOLDER/ddk_ext"
        install -m 0644 "$GITHUB_ACTION_PATH/files/ddk/BUILD.bazel" "$KERNEL_PLATFORM_FOLDER/ddk_ext/BUILD.bazel"
        install -m 0644 "$GITHUB_ACTION_PATH/files/ddk/gki_build_config.fragment" "$KERNEL_PLATFORM_FOLDER/ddk_ext/gki_build_config.fragment"
        install -m 0644 "$GITHUB_ACTION_PATH/files/ddk/user.bazelrc" "$KERNEL_PLATFORM_FOLDER/user.bazelrc"

        # kernel_platform/ holds MODULE.bazel, and bazel.py finds the workspace
        # by walking up from the cwd to the first repo boundary file, so
        # kernel_platform is the workspace root and //vendor/... resolves to
        # kernel_platform/vendor/... The WLAN sources live one level up, in the
        # modules repo that syncs to the config dir. Bridge that with a symlink
        # so the labels in qcacld's own wlan_qcacld3_modules.bzl (which are all
        # //vendor/qcom/opensource/...) resolve unmodified.
        for d in vendor; do
          if [ ! -e "$KERNEL_PLATFORM_FOLDER/$d" ]; then
            ln -s "../$d" "$KERNEL_PLATFORM_FOLDER/$d"
            echo "Linked kernel_platform/$d -> ../$d"
          fi
        done
        for d in wlan/qcacld-3.0 wlan/platform dataipa; do
          if [ ! -d "$KERNEL_PLATFORM_FOLDER/vendor/qcom/opensource/$d" ]; then
            echo "::error::kernel_platform/vendor/qcom/opensource/$d does not resolve"
            exit 1
          fi
        done

        # msm-kernel's msm_platforms.bzl does load("//build:msm_kernel_extensions.bzl"),
        # which is a symlink normally created by build_with_bazel.py's
        # setup_extensions(). Create it directly: we invoke tools/bazel rather
        # than that wrapper, and a missing load() fails at parse time.
        #
        # build/abl_extensions.bzl is deliberately not created. Nothing
        # load()s it -- msm_abl.bzl only aliases //bootable/bootloader/edk2,
        # and an alias is only resolved if built, which no target here does.
        EXT_LINK="$KERNEL_PLATFORM_FOLDER/build/msm_kernel_extensions.bzl"
        if [ ! -e "$EXT_LINK" ]; then
          [ -L "$EXT_LINK" ] && rm -f "$EXT_LINK"
          ln -s "../msm-kernel/msm_kernel_extensions.bzl" "$EXT_LINK"
          echo "Linked build/msm_kernel_extensions.bzl -> ../msm-kernel/msm_kernel_extensions.bzl"
        fi
        if [ ! -f "$EXT_LINK" ]; then
          echo "::error::$EXT_LINK does not resolve to a file"
          ls -la "$EXT_LINK" || true
          exit 1
        fi

        # Kleaf's common.bazelrc try-imports %workspace%/user.bazelrc last, so
        # append rather than replace to keep the flags above.
        {
          echo ""
          echo "# --- appended by Prepare Bazel/DDK build ---"
          echo "build --jobs=$(nproc --all)"
          case "${{ env.OP_LTO }}" in
            none|thin|full) echo "build --lto=${{ env.OP_LTO }}" ;;
            *) echo "::error::Unsupported LTO option: ${{ env.OP_LTO }}" >&2; exit 1 ;;
          esac
        } >> "$KERNEL_PLATFORM_FOLDER/user.bazelrc"

        echo "Effective user.bazelrc:"
        cat "$KERNEL_PLATFORM_FOLDER/user.bazelrc"

        KERNEL_TARGET="//msm-kernel:${OP_DDK_TARGET}"
        MODULE_TARGET="//vendor/qcom/opensource/wlan/qcacld-3.0:${OP_DDK_TARGET}_qca_cld_${OP_DDK_CHIPSET}"
        echo "DDK_KERNEL_TARGET=$KERNEL_TARGET" >> "$GITHUB_ENV"
        echo "DDK_MODULE_TARGET=$MODULE_TARGET" >> "$GITHUB_ENV"
        echo "Kernel target : $KERNEL_TARGET"
        echo "Module target : $MODULE_TARGET"
        echo "::endgroup::"

    - name: Build Kernel and DDK modules with Bazel
      id: build_ddk_step
      if: ${{ env.OP_DDK == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Build kernel + qcacld-3.0 with Bazel"

        cd "$KERNEL_PLATFORM_FOLDER"

        export KBUILD_BUILD_USER="${BUILD_USER:-kernel}"
        export KBUILD_BUILD_HOST="${BUILD_HOST:-kleaf}"
        if [ -n "${{ inputs.build_timestamp }}" ]; then
          export KBUILD_BUILD_TIMESTAMP="${{ inputs.build_timestamp }}"
        else
          export KBUILD_BUILD_TIMESTAMP="$(date -u)"
        fi
        echo "EFFECTIVE_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP" >> "$GITHUB_ENV"

        BUILD_START=$(date +%s)
        set -o pipefail

        # The module's kernel_build is //msm-kernel:<target>, whose base_kernel
        # is //common:kernel_aarch64, so one invocation builds GKI, the vendor
        # kernel and the module against a single consistent Module.symvers.
        #
        # <target>_modules_install is built explicitly: the vendor kernel's
        # in_tree_modules include the cfg80211/mac80211 that the DDK module
        # links against, and the staging step needs them in a depmod-shaped
        # tree to resolve the dependency closure for the modules ZIP.
        if ! ./tools/bazel build \
          "$DDK_KERNEL_TARGET" \
          "${DDK_KERNEL_TARGET}_modules_install" \
          "$DDK_MODULE_TARGET" \
          2>&1 | tee "$COMMON_KERNEL_FOLDER/build.log"; then
          echo "::error::Bazel build failed; tail of build.log:"
          tail -n 300 "$COMMON_KERNEL_FOLDER/build.log" || true
          exit 1
        fi

        # The vendor kernel's archive is named modules_staging_dir_self.tar.gz:
        # Kleaf declares the "_self" variant for any target with a base_kernel,
        # because _repack_modules_staging_archive later merges the GKI modules
        # into it. Both archives are listed here for the record.
        echo "::group::Bazel output inventory"
        find -L bazel-bin -name 'modules_staging_dir*.tar.gz' -printf '  %p (%s bytes)\n' 2>/dev/null | sort || true
        echo "::endgroup::"

        BUILD_END=$(date +%s)
        echo "BUILD_START=$BUILD_START" >> "$GITHUB_ENV"
        echo "BUILD_END=$BUILD_END" >> "$GITHUB_ENV"
        echo "BUILD_TIME=$((BUILD_END - BUILD_START))" >> "$GITHUB_ENV"
        echo "::endgroup::"

    - name: Upload build.log on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ env.OP_MODEL }}
        path: ${{ env.COMMON_KERNEL_FOLDER }}/build.log
        if-no-files-found: ignore

    - name: Stage Bazel outputs
      if: ${{ env.OP_DDK == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Stage Bazel outputs"

        cd "$KERNEL_PLATFORM_FOLDER"

        # Downstream steps (Collect Build Stats, Create Kernel ZIP, Create
        # Kernel Modules ZIP) read from out/ and out/install, so mirror the
        # kbuild layout instead of teaching each of them about bazel-bin.
        OUT="$COMMON_KERNEL_FOLDER/out"
        install -d "$OUT/arch/arm64/boot"

        IMAGE="$(find -L bazel-bin -type f -name Image -path '*kernel_aarch64*' -print -quit 2>/dev/null || true)"
        if [ -z "$IMAGE" ]; then
          IMAGE="$(find -L bazel-bin -type f -name Image -print -quit 2>/dev/null || true)"
        fi
        if [ -z "$IMAGE" ]; then
          echo "::error::No kernel Image found under bazel-bin"
          find -L bazel-bin -maxdepth 4 -name 'Image*' 2>/dev/null | head -20 || true
          exit 1
        fi
        echo "Image: $IMAGE"
        install -m 0644 "$IMAGE" "$OUT/arch/arm64/boot/Image"

        # Create Kernel Modules ZIP walks out/install/lib/modules/<release>/ and
        # resolves the transitive closure over modules.dep, so it needs a real
        # modules_install tree: a flat directory has no kernel/net/can or
        # kernel/net/mac80211 to seed from, and the ZIP silently ends up holding
        # only the modules staged by hand below.
        #
        # Take it from modules_staging_dir.tar.gz, which kernel_build produces
        # for every target and kernel_modules_install merely extracts. When a
        # target has a base_kernel -- //msm-kernel:<target> does -- Kleaf
        # repacks that archive to hold the vendor modules *and* the GKI ones
        # (_repack_modules_staging_archive), so the vendor archive alone is the
        # complete set. That matters here: cfg80211 and mac80211 are vendor
        # in-tree modules and are absent from the GKI archive, which is why run
        # 31037418577 produced a 27-module pack without them.
        install -d "$OUT/install/lib/modules"

        echo "modules_staging archives under bazel-bin:"
        find -L bazel-bin -type f -name 'modules_staging_dir*.tar.gz' \
          -printf '  %p (%s bytes)\n' 2>/dev/null | sort || true

        # Prefer the vendor archive wherever it is; fall back to GKI's. Matching
        # on the target directory rather than a fixed path, because the previous
        # three attempts all guessed the layout wrong.
        VENDOR_TGZ="$(find -L bazel-bin -type f -name 'modules_staging_dir*.tar.gz' \
          -path "*/${OP_DDK_TARGET}/*" -print -quit 2>/dev/null || true)"
        if [ -z "$VENDOR_TGZ" ]; then
          VENDOR_TGZ="$(find -L bazel-bin -type f -name 'modules_staging_dir*.tar.gz' \
            -path '*msm-kernel*' -print -quit 2>/dev/null || true)"
        fi
        GKI_TGZ="$(find -L bazel-bin -type f -name 'modules_staging_dir*.tar.gz' \
          -path '*kernel_aarch64*' -print -quit 2>/dev/null || true)"

        STAGED=0
        for tgz in "$VENDOR_TGZ" "$GKI_TGZ"; do
          [ -n "$tgz" ] && [ -f "$tgz" ] || continue
          echo "Extracting $tgz"
          tar xzf "$tgz" -C "$OUT/install" 2>/dev/null || true
          STAGED=$((STAGED + 1))
        done

        chmod -R u+w "$OUT/install/lib/modules" 2>/dev/null || true
        UNAME_DIR="$(find "$OUT/install/lib/modules" -mindepth 1 -maxdepth 1 -type d -print -quit 2>/dev/null || true)"
        if [ "$STAGED" -eq 0 ] || [ -z "$UNAME_DIR" ]; then
          # Failing here is deliberate: staging a flat directory is what let run
          # 31029431344 ship a two-module ZIP from a green build.
          echo "::error::No modules_staging archive could be staged"
          find -L bazel-bin -name 'modules_staging*' 2>/dev/null | head -20 || true
          exit 1
        fi
        echo "Staged $STAGED archive(s) into $UNAME_DIR"
        # A real modules_install tree has the kernel/ subtree the packaging step
        # seeds from; a flat one does not.
        if [ ! -d "$UNAME_DIR/kernel" ]; then
          echo "::error::$UNAME_DIR has no kernel/ subtree; layout is not modules_install-shaped"
          ls -la "$UNAME_DIR" | head -20 || true
          exit 1
        fi

        # The DDK module is built by its own ddk_module target and is not part of
        # the kernel's modules_install tree, so place it explicitly.
        EXPECTED_KO="qca_cld3_$(echo "$OP_DDK_CHIPSET" | tr '-' '_').ko"
        DDK_KO="$(find -L bazel-bin -type f -name "$EXPECTED_KO" -print -quit 2>/dev/null || true)"
        if [ -z "$DDK_KO" ]; then
          echo "::error::DDK module $EXPECTED_KO was not produced"
          find -L bazel-bin -type f -name '*.ko' 2>/dev/null | head -40 || true
          exit 1
        fi
        # UNAME_DIR was resolved when the staging archive was extracted.
        install -d "$UNAME_DIR/kernel/drivers/net/wireless"
        install -m 0644 "$DDK_KO" "$UNAME_DIR/kernel/drivers/net/wireless/$EXPECTED_KO"
        echo "DDK module staged: $EXPECTED_KO ($(numfmt --to=iec-i --suffix=B "$(stat -c%s "$DDK_KO")") unstripped)"

        # kernel_build.strip_modules defaults to False and msm-kernel never sets
        # it (only //common:kernel_aarch64 passes strip_modules = True), so every
        # vendor and DDK module carries full debug info. Unstripped,
        # qca_cld3_peach_v2.ko alone is ~700 MiB and the modules ZIP came to
        # 323 MiB, which is not shippable.
        #
        # Strip debug sections only. --strip-debug keeps the symbol table and
        # .modinfo, so modversions CRCs and depmod still work, which
        # --strip-unneeded or a plain strip would break.
        STRIP_BIN=""
        for cand in "${CLANG_BIN_PATH:-}/llvm-strip" \
                    "$KERNEL_PLATFORM_FOLDER/prebuilts/clang/host/linux-x86/clang-r510928/bin/llvm-strip"; do
          if [ -n "$cand" ] && [ -x "$cand" ]; then STRIP_BIN="$cand"; break; fi
        done
        if [ -z "$STRIP_BIN" ]; then
          STRIP_BIN="$(command -v llvm-strip || command -v aarch64-linux-gnu-strip || command -v strip || true)"
        fi
        if [ -z "$STRIP_BIN" ]; then
          echo "::error::No strip tool found; modules would ship unstripped"
          exit 1
        fi
        echo "Stripping debug info with $STRIP_BIN"
        BEFORE=$(du -sb "$OUT/install/lib/modules" | cut -f1)
        find "$OUT/install/lib/modules" -type f -name '*.ko' -print0 |
          xargs -0 -r -n 32 -P "$(nproc --all)" "$STRIP_BIN" --strip-debug
        AFTER=$(du -sb "$OUT/install/lib/modules" | cut -f1)
        echo "Modules: $(numfmt --to=iec-i --suffix=B "$BEFORE") -> $(numfmt --to=iec-i --suffix=B "$AFTER")"

        DDK_STAGED="$UNAME_DIR/kernel/drivers/net/wireless/$EXPECTED_KO"
        DDK_SIZE=$(stat -c%s "$DDK_STAGED")
        echo "✅ DDK module: $EXPECTED_KO ($(numfmt --to=iec-i --suffix=B "$DDK_SIZE"))"
        # A stripped qcacld module is tens of MiB. Anything near the unstripped
        # size means the strip silently did nothing.
        if [ "$DDK_SIZE" -gt 209715200 ]; then
          echo "::error::$EXPECTED_KO is still $(numfmt --to=iec-i --suffix=B "$DDK_SIZE") after stripping"
          exit 1
        fi

        # Re-run depmod so the DDK module appears in modules.dep; the ZIP step
        # resolves its dependency closure from that file.
        depmod -b "$OUT/install" "$(basename "$UNAME_DIR")" || true

        # Fail early if AR9271 stack was requested but Kleaf dropped the kos
        # (e.g. undeclared module_outs without --allow_undeclared_modules).
        if [ "${OP_WIRELESS_MODULES:-false}" = "true" ] && [ "${OP_NETHUNTER:-false}" = "true" ]; then
          for m in ath9k_htc ath9k_hw ath9k_common ath rtl8xxxu rt2800usb; do
            if [ -z "$(find "$UNAME_DIR" -name "$m.ko" -print -quit)" ]; then
              echo "::error::$m.ko missing from modules_install tree after DDK stage"
              find "$UNAME_DIR" \( -name 'ath*.ko' -o -name 'rt*.ko' \) 2>/dev/null | head -20 || true
              exit 1
            fi
          done
          echo "AR9271 stack + zoo canaries present in staging tree"
          # Kleaf stages only the .kos named in sun.bzl in_tree_module_list.
          # A wrong path there means a module is built but never shipped; turn
          # that into a loud one-shot failure instead of a silently thin pack.
          ORPHANS="$(comm -23 \
            <(find -L bazel-bin -type f -name '*.ko' -printf '%f\n' 2>/dev/null | sort -u) \
            <(find "$OUT/install/lib/modules" -type f -name '*.ko' -printf '%f\n' | sort -u))"
          if [ -n "$ORPHANS" ]; then
            echo "::error::Modules built but not staged (check sun.bzl in_tree_module_list paths):"
            echo "$ORPHANS" | sed 's/^/  /'
            exit 1
          fi
        fi

        MODCOUNT="$(find "$OUT/install/lib/modules" -type f -name '*.ko' | wc -l)"
        echo "Staged $MODCOUNT module(s) under $(basename "$UNAME_DIR")"

        for f in vmlinux Module.symvers System.map; do
          found="$(find -L bazel-bin -type f -name "$f" -print -quit 2>/dev/null || true)"
          [ -n "$found" ] && install -m 0644 "$found" "$OUT/$f" || true
        done
        echo "::endgroup::"

    - name: Verify Bazel defconfig
      if: ${{ env.OP_DDK == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Verify Bazel defconfig"

        # gki_build_config.fragment clears POST_DEFCONFIG_CMDS, which disables
        # Kleaf's whole-file check_defconfig. Assert the options this pipeline
        # actually depends on made it into the resolved .config instead.
        cd "$KERNEL_PLATFORM_FOLDER"
        DOTCONFIG="$(find -L bazel-bin -type f -name '.config' -path '*kernel_aarch64*' -print -quit 2>/dev/null || true)"
        if [ -z "$DOTCONFIG" ]; then
          DOTCONFIG="$(find -L bazel-bin -type f -name '.config' -print -quit 2>/dev/null || true)"
        fi
        if [ -z "$DOTCONFIG" ]; then
          echo "::warning::No resolved .config found under bazel-bin; skipping verification"
          echo "::endgroup::"
          exit 0
        fi
        echo "Using $DOTCONFIG"

        FAILED=0
        assert_config() {
          if ! grep -qx "$1" "$DOTCONFIG"; then
            echo "::error::Expected '$1' in resolved .config"
            grep -E "^(# )?${1%%=*}[= ]" "$DOTCONFIG" || echo "  (option absent entirely)"
            FAILED=1
          fi
        }

        [ "${{ inputs.ksu_type }}" = "none" ] || assert_config "CONFIG_KSU=y"
        if [ "$OP_SUSFS" = "true" ]; then
          assert_config "CONFIG_KSU_SUSFS=y"
        fi
        if [ "$OP_NTSYNC" = "true" ]; then
          assert_config "CONFIG_NTSYNC=y"
        fi
        if [ "$OP_BBR3" = "true" ] || [ "$OP_BBR" = "true" ]; then
          assert_config "CONFIG_TCP_CONG_BBR=y"
        fi
        if [ "$OP_WIRELESS_MODULES" = "true" ] && [ "$OP_DDK" != "true" ]; then
          assert_config "CONFIG_CFG80211=m"
          assert_config "CONFIG_MAC80211=m"
          assert_config "CONFIG_ATH9K_HTC=m"
        fi
        # On the DDK path cfg80211/mac80211 come from msm-kernel in_tree_modules
        # and ath9k_htc is asserted from the staged modules ZIP / Stage step.
        [ "$FAILED" -eq 0 ] || exit 1
        echo "✅ defconfig assertions passed"

        # Compare the shipped artifacts, not a config file. The previous check
        # read GKI's .config, found the branding, and passed -- while the vendor
        # modules had been built from msm-kernel's own defconfig and carried a
        # different vermagic (run 31045666257). A module whose vermagic differs
        # from the kernel is refused at load, so this is the check that matters.
        IMG="$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image"
        KREL="$(basename "$(find "$COMMON_KERNEL_FOLDER/out/install/lib/modules" -mindepth 1 -maxdepth 1 -type d -print -quit)")"
        MISMATCH=0
        KO_CHECK="qca_cld3_$(echo "$OP_DDK_CHIPSET" | tr '-' '_') cfg80211 mac80211"
        if [ "${OP_WIRELESS_MODULES:-false}" = "true" ] && [ "${OP_NETHUNTER:-false}" = "true" ]; then
          KO_CHECK="$KO_CHECK ath9k_htc ath9k_hw ath9k_common ath"
        fi
        for ko in $KO_CHECK; do
          f="$(find "$COMMON_KERNEL_FOLDER/out/install/lib/modules" -name "$ko.ko" -print -quit)"
          [ -n "$f" ] || { echo "::error::$ko.ko not staged"; MISMATCH=1; continue; }
          VM="$(tr -d '\0' < "$f" | grep -ao 'vermagic=[^ ]*' | head -1 | cut -d= -f2)"
          if [ "$VM" != "$KREL" ]; then
            echo "::error::$ko.ko vermagic '$VM' != kernel release '$KREL'"
            MISMATCH=1
          else
            echo "  $ko.ko vermagic $VM"
          fi
        done
        case "$KREL" in
          *"$OP_UNAME"*) echo "  kernel release carries $OP_UNAME" ;;
          *) echo "::error::kernel release '$KREL' does not carry '$OP_UNAME'"; MISMATCH=1 ;;
        esac
        [ "$MISMATCH" -eq 0 ] || exit 1
        echo "✅ Image and modules agree on $KREL"
        echo "::endgroup::"

    - name: Build Kernel
      id: build_kernel_step
      if: ${{ env.OP_DDK != 'true' }}
      shell: bash
      env:
        PYTHONWARNINGS: "ignore:invalid escape sequence"
      run: |
        set -euo pipefail
        echo "::group::Build kernel with ccache optimization"

        cd "$COMMON_KERNEL_FOLDER"
        : > "$COMMON_KERNEL_FOLDER/.scmversion"

        export PYTHONWARNINGS="${PYTHONWARNINGS}"

        echo "Getting last commit timestamp from kernel source..."
        COMMIT_TIMESTAMP=$(git log -1 --format=%ct 2>/dev/null || echo "$(date +%s)")
        COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S' 2>/dev/null || date -u '+%Y-%m-%d %H:%M:%S')
        COMMIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")

        WORKSPACE="${GITHUB_WORKSPACE}"
        MAP="-fdebug-prefix-map=${WORKSPACE}=."
        MPMAP="-fmacro-prefix-map=${WORKSPACE}=."
        FPMAP="-ffile-prefix-map=${WORKSPACE}=."

        export KCFLAGS="${KCFLAGS:-} $MAP $MPMAP $FPMAP -no-canonical-prefixes -fdiagnostics-color=never -Qunused-arguments -Wno-unused-command-line-argument -D__ANDROID_COMMON_KERNEL__"
        export KCPPFLAGS="${KCPPFLAGS:-} $MAP $MPMAP $FPMAP"

        export LLVM=1 LLVM_IAS=1
        export ARCH=arm64 SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export PAHOLE="$KERNEL_PLATFORM_FOLDER/prebuilts/kernel-build-tools/linux-x86/bin/pahole"
        export LD=ld.lld HOSTLD=ld.lld AR=llvm-ar NM=llvm-nm
        export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

        set +u
        source "$KERNEL_PLATFORM_FOLDER/build/kernel/_setup_env.sh" 2>/dev/null || true
        set -u

        # ld-wrapper is only needed for thin LTO to spread work across cores
        if [ "${{ env.OP_LTO }}" = "thin" ]; then
          echo '#!/bin/bash' > "$COMMON_KERNEL_FOLDER/ld-wrapper"
          echo 'ld.lld "$@" --thinlto-jobs=$(nproc --all)' >> "$COMMON_KERNEL_FOLDER/ld-wrapper"
          chmod +x "$COMMON_KERNEL_FOLDER/ld-wrapper"
          LD_CMD="$COMMON_KERNEL_FOLDER/ld-wrapper"
          echo "Using ld-wrapper for thin LTO"
        else
          LD_CMD="ld.lld"
          echo "Using ld.lld directly (LTO=${{ env.OP_LTO }})"
        fi

        KERNEL_BUILD_DATE=$(date -u)
        export SOURCE_DATE_EPOCH=$COMMIT_TIMESTAMP
        if [ -n "${{ inputs.build_timestamp }}" ]; then
          export KBUILD_BUILD_TIMESTAMP="${{ inputs.build_timestamp }}"
          echo "📅 Using custom build timestamp: $KBUILD_BUILD_TIMESTAMP"
        else
          export KBUILD_BUILD_TIMESTAMP="$KERNEL_BUILD_DATE"
          echo "📅 Using current UTC build timestamp: $KBUILD_BUILD_TIMESTAMP"
        fi
        echo "EFFECTIVE_BUILD_TIMESTAMP=$KBUILD_BUILD_TIMESTAMP" >> "$GITHUB_ENV"
        export KBUILD_BUILD_USER="${BUILD_USER:-kernel}"
        export KBUILD_BUILD_HOST="${BUILD_HOST:-kleaf}"
        export KBUILD_BUILD_VERSION=1
        echo "🔢 SOURCE_DATE_EPOCH: $SOURCE_DATE_EPOCH"
        echo "👤 Build user: $KBUILD_BUILD_USER"
        echo "🖥️  Build host: $KBUILD_BUILD_HOST"

        export CC="ccache clang"
        export CXX="ccache clang++"
        export HOSTCC="ccache clang"
        export HOSTCXX="ccache clang++"

        if [ "${{ inputs.clean }}" = "false" ]; then
          echo "🚀 ccache-accelerated build"
        else
          echo "🧹 Clean build mode"
        fi

        OUT=out
        mkdir -p "$OUT"

        echo "============================================"
        echo "🔍 Compiler & ccache Verification"
        echo "============================================"
        echo "PATH: ${PATH:0:200}..."
        echo "which clang: $(which clang)"
        echo "CC: $CC"
        echo "CXX: $CXX"
        echo "CCACHE_BASEDIR: ${CCACHE_BASEDIR:-not set}"
        echo ""

        echo "ccache wrapper test:"
        clang --version 2>&1 | head -n1 || true
        echo ""
        echo "ccache configuration:"
        ccache -p | grep -E "(compression|direct_mode|readonly_direct|depend|sloppiness)" || true
        echo ""
        echo "ccache pre-build status:"
        ccache -s | head -n 20
        echo "============================================"

        make LD="$LD_CMD" HOSTLD="$LD_CMD" O="$OUT" gki_defconfig

        LOCAL_LOCALVERSION="${CUSTOM_LOCALVERSION:--OP-WILD}"
        if [ -n "${LOCAL_LOCALVERSION:-}" ]; then
          scripts/config --file "$OUT/.config" --set-str LOCALVERSION "${LOCAL_LOCALVERSION}"
          scripts/config --file "$OUT/.config" -d LOCALVERSION_AUTO || true
          sed -i 's/scm_version="$(scm_version --short)"/scm_version=""/' scripts/setlocalversion
        fi

        if [ "${{ inputs.optimize_level }}" = "O3" ]; then
          scripts/config --file "$OUT/.config" -d CC_OPTIMIZE_FOR_PERFORMANCE -e CC_OPTIMIZE_FOR_PERFORMANCE_O3
          KCFLAGS_EXTRA="-O3"
        else
          scripts/config --file "$OUT/.config" -e CC_OPTIMIZE_FOR_PERFORMANCE -d CC_OPTIMIZE_FOR_PERFORMANCE_O3
          KCFLAGS_EXTRA="-O2"
        fi

        case "$OP_BRANCH" in
          wild/sm8750|wild/sm8850|wild/sm8845)
            KCFLAGS_EXTRA="-mcpu=oryon-1 ${KCFLAGS_EXTRA}"
            ;;
        esac

        scripts/config --file "$OUT/.config" -e LTO_CLANG -d LTO_CLANG_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL

        case "${{ env.OP_LTO}}" in
          "none") scripts/config --file "$OUT/.config" -e LTO_CLANG_NONE ;;
          "thin") scripts/config --file "$OUT/.config" -e LTO_CLANG_THIN ;;
          "full") scripts/config --file "$OUT/.config" -e LTO_CLANG_FULL ;;
          *)
            echo "::error::Unsupported LTO option: ${{ env.OP_LTO}}"
            exit 1
            ;;
        esac


        make LD="$LD_CMD" HOSTLD="$LD_CMD" O="$OUT" olddefconfig

        KCFLAGS="$KCFLAGS -Wno-error -pipe ${KCFLAGS_EXTRA}"
        KCPPFLAGS="$KCPPFLAGS -DCONFIG_OPTIMIZE_INLINING"

        echo "============================================"
        echo "🔧 Build Configuration"
        echo "============================================"
        echo "Device: ${OP_MODEL}"
        echo "Kernel: ${KERNEL_FULL_VER}"
        echo "Threads: $(nproc --all)"
        echo "Optimization: ${{ inputs.optimize_level }}"
        echo "KCFLAGS: ${KCFLAGS:0:150}..."
        echo "KCPPFLAGS: ${KCPPFLAGS:0:150}..."
        echo "Timestamp: $KBUILD_BUILD_TIMESTAMP"
        echo "Workspace: $WORKSPACE"

        echo "ccache: ENABLED"
        echo "  Dir: $CCACHE_DIR"
        echo "  Base: $CCACHE_BASEDIR"
        echo "  Max size: $CCACHE_MAXSIZE"
        echo "  Compression: zstd level 3"
        echo "  Features: readonly_direct, file_clone, inode_cache, depend"
        echo "============================================"

        if [ ! -d "$CCACHE_DIR" ] || [ -z "$(find "$CCACHE_DIR" -maxdepth 2 -type f -print -quit 2>/dev/null)" ]; then
          echo "🔥 Priming cache with header preprocessing..."
          make LD="$LD_CMD" HOSTLD="$LD_CMD" -C "$COMMON_KERNEL_FOLDER" O="$OUT" headers_install prepare 2>&1 | head -n 20 || true
          echo ""
        fi

        BUILD_START=$(date +%s)
        set -o pipefail

        if [ "${{ inputs.debug }}" == "true" ]; then
          make V=1 LD="$LD_CMD" HOSTLD="$LD_CMD" -j"$(nproc --all)" O="$OUT" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" CONFIG_FAKE_DISABLE="$CONFIG_FAKE_DISABLE" Image modules 2>&1 | tee build.log
          make V=1 LD="$LD_CMD" HOSTLD="$LD_CMD" -j"$(nproc --all)" O="$COMMON_KERNEL_FOLDER/out" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" CONFIG_FAKE_DISABLE="$CONFIG_FAKE_DISABLE" INSTALL_MOD_PATH="$COMMON_KERNEL_FOLDER/out/install" modules_install 2>&1 | tee install.log

          cp build.log "$DEBUG_ARTIFACTS_FOLDER/build.log"
          cp install.log "$DEBUG_ARTIFACTS_FOLDER/install.log"
          rsync -av --no-links --exclude='build' "$COMMON_KERNEL_FOLDER/out/install/lib/modules"/*/ "$DEBUG_ARTIFACTS_FOLDER"
          cp "$COMMON_KERNEL_FOLDER/out/vmlinux" "$DEBUG_ARTIFACTS_FOLDER/vmlinux"
          cp "$COMMON_KERNEL_FOLDER/out/Module.symvers" "$DEBUG_ARTIFACTS_FOLDER/Module.symvers"
          cp "$COMMON_KERNEL_FOLDER/out/System.map" "$DEBUG_ARTIFACTS_FOLDER/System.map"

          ls -la "$DEBUG_ARTIFACTS_FOLDER"
        elif [ "${OP_WIRELESS_MODULES:-false}" = "true" ]; then
          # Wireless drivers are =m, so 'modules' must be built and installed
          # even outside debug mode; the Create Kernel Modules ZIP step packages
          # them from out/install.
          make LD="$LD_CMD" HOSTLD="$LD_CMD" -j"$(nproc --all)" O="$OUT" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" CONFIG_FAKE_DISABLE="$CONFIG_FAKE_DISABLE" Image modules 2>&1 | tee build.log
          make LD="$LD_CMD" HOSTLD="$LD_CMD" -j"$(nproc --all)" O="$OUT" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" CONFIG_FAKE_DISABLE="$CONFIG_FAKE_DISABLE" INSTALL_MOD_PATH="$COMMON_KERNEL_FOLDER/out/install" modules_install 2>&1 | tee install.log
        else
          make LD="$LD_CMD" HOSTLD="$LD_CMD" -j"$(nproc --all)" O="$OUT" KCFLAGS="$KCFLAGS" KCPPFLAGS="$KCPPFLAGS" CONFIG_FAKE_DISABLE="$CONFIG_FAKE_DISABLE" Image 2>&1 | tee build.log
        fi

        BUILD_END=$(date +%s)
        BUILD_TIME=$((BUILD_END - BUILD_START))

        echo "BUILD_START=$BUILD_START" >> "$GITHUB_ENV"
        echo "BUILD_END=$BUILD_END" >> "$GITHUB_ENV"
        echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_ENV"

        IMG="$OUT/arch/arm64/boot/Image"
        if [ ! -f "$IMG" ]; then
          echo "::error::Kernel Image missing"
          echo "::group::Last 100 lines of build log"
          tail -n 100 build.log || echo "Build log not available"
          echo "::endgroup::"
          exit 1
        fi

        IMG_SIZE=$(stat -c%s "$IMG")

        echo "============================================"
        echo "✅ Build Completed Successfully"
        echo "============================================"
        echo "Duration: $((BUILD_TIME / 60))m $((BUILD_TIME % 60))s"
        echo "Image: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"

        echo ""
        echo "📊 ccache Post-Build Statistics"
        echo "============================================"
        ccache -s
        echo "============================================"
        echo "::endgroup::"

    - name: 📊 ccache Post-Build Statistics
      id: ccache_stats
      if: ${{ success() && (inputs.clean == false || inputs.clean == 'false') }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::ccache final statistics"

        export CCACHE_DIR="${{ env.CCACHE_DIR }}"

        echo "Clear Temporary cache files..."
        ccache -c

        echo "Perform ccache eviction!"
        # 0.5 days = 12 Hrs. Delete cache unused in 12 hrs. 12 hrs is considered for safety.
        # Yes. ccache uses mtime as a store of time due to cross compatibility with different OS.
        find "$CCACHE_DIR" -type f -mtime +0.5 -delete
        # Remove empty layout subdirectories
        find "$CCACHE_DIR" -type d -empty -delete

        if [ -n "${{ env.CCACHE_LOGFILE }}" ] && [ -f "${{ env.CCACHE_LOGFILE }}" ]; then
          cp "${{ env.CCACHE_LOGFILE }}" "$CCACHE_DIR/"
        else
          echo "⚠ ccache log not found, skipping cache copy."
        fi

        if [ "${{ inputs.debug }}" == "true" ]; then
          if [ -f "${{ env.CCACHE_LOGFILE }}" ]; then
            echo "Rename ccache log"
            LOG_DIR=$(dirname "${{ env.CCACHE_LOGFILE }}")
            NEW_LOG_NAME="${{ env.OP_MODEL }}_${{ env.OP_OS_VERSION }}_${{ env.KERNEL_FULL_VER }}_ccache.log"
            mv "${{ env.CCACHE_LOGFILE }}" "$LOG_DIR/$NEW_LOG_NAME"
            echo "CCACHE_LOGFILE=$LOG_DIR/$NEW_LOG_NAME" >> $GITHUB_ENV
          else
            echo "⚠ ccache log not found, skipping rename."
          fi
        fi

        STATS="$(ccache -s)"

        CACHEABLE=$(echo "$STATS" | awk '/Cacheable calls:/ {
          match($0, /[0-9]+/);
          print substr($0, RSTART, RLENGTH)
        }' | head -n1)

        HITS=$(echo "$STATS" | awk '/^[[:space:]]*Hits:/ {
          match($0, /[0-9]+/);
          print substr($0, RSTART, RLENGTH)
        }' | head -n1)

        DIRECT=$(echo "$STATS" | awk '/Direct:/ {
          match($0, /[0-9]+/);
          print substr($0, RSTART, RLENGTH)
        }' | head -n1)

        if [ "${CACHEABLE:-0}" -gt 0 ]; then
          HIT_RATE=$(awk -v h="${HITS:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (h/c)*100}')
          DIRECT_RATE=$(awk -v d="${DIRECT:-0}" -v c="$CACHEABLE" 'BEGIN{printf "%.1f", (d/c)*100}')
        else
          HIT_RATE="0.0"
          DIRECT_RATE="0.0"
        fi

        echo "hit_rate=${HIT_RATE}%" >> "$GITHUB_OUTPUT"
        echo "direct_rate=${DIRECT_RATE}%" >> "$GITHUB_OUTPUT"

        echo "::endgroup::"

        echo "## 📊 ccache Statistics" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        ccache -s --verbose >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Collect Build Stats / Validate Image
      id: collect_stats
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Collect Build stats"
        IMG="$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image"

        if [ -f "$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image" ]; then
          IMG="$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image"
        elif [ -f "$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image" ]; then
          IMG="$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image"
        fi

        if [ -f "$COMMON_KERNEL_FOLDER/build.log" ]; then
          WARNINGS_COUNT="$(grep -ciE '\bwarning:' "$COMMON_KERNEL_FOLDER/build.log" || true)"
          [ -n "$WARNINGS_COUNT" ] || WARNINGS_COUNT="0"
        else
          WARNINGS_COUNT="0"
        fi

        if [ ! -f "$IMG" ]; then
          echo "::error::Kernel Image not found at: $IMG"
          exit 1
        fi

        if ! file "$IMG" | grep -qi 'ARM64'; then
          echo "::error::Image is not ARM64 format"
          file "$IMG"
          exit 1
        fi

        IMG_SIZE=$(stat -c %s "$IMG")
        MIN_SIZE=6102400
        if [ "$IMG_SIZE" -lt "$MIN_SIZE" ]; then
          echo "::error::Image size too small: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"
          exit 1
        fi

        IMG_SHA256=$(sha256sum "$IMG" | awk '{print $1}')
        BUILD_TIME="${BUILD_TIME:-0}"

        KERNEL_UNAME=$(strings "$IMG" | grep -E 'Linux version.*#' | tail -n1)
        echo "Kernel Uname: $KERNEL_UNAME"
        echo "KERNEL_UNAME=$KERNEL_UNAME" >> "$GITHUB_ENV"

        printf 'warnings_count=%s\n' "$WARNINGS_COUNT" >> "$GITHUB_OUTPUT"
        printf 'image_sha256=%s\n' "$IMG_SHA256" >> "$GITHUB_OUTPUT"
        printf 'build_time=%s\n' "$BUILD_TIME" >> "$GITHUB_OUTPUT"
        printf 'build_timestamp=%s\n' "${EFFECTIVE_BUILD_TIMESTAMP:-unknown}" >> "$GITHUB_OUTPUT"

        echo "✅ Validation passed:"
        echo "   - Warnings: $WARNINGS_COUNT"
        echo "   - Image size: $(numfmt --to=iec-i --suffix=B "$IMG_SIZE")"
        echo "   - SHA256: $IMG_SHA256"
        echo "   - Build time: ${BUILD_TIME}s"
        echo "::endgroup::"

    - name: Create Kernel ZIP
      id: create_zip
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Create kernel ZIP package"

        IMAGE_PATH="$COMMON_KERNEL_FOLDER/out/arch/arm64/boot/Image"

        if [ -f "$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image" ]; then
          IMAGE_PATH="$KERNEL_PLATFORM_FOLDER/out/$OP_ANDROID_VERSION-$OP_KERNEL_VERSION/dist/Image"
        elif [ -f "$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image" ]; then
          IMAGE_PATH="$KERNEL_PLATFORM_FOLDER/bazel-bin/common/kernel_aarch64/Image"
        fi

        if [ ! -f "$IMAGE_PATH" ]; then
          echo "::error::Built Image not found at: $IMAGE_PATH"
          exit 1
        fi

        cp "$IMAGE_PATH" "$AK3_FOLDER/Image"

        # Expose the Image and artifacts locations (workspace-relative) so
        # callers do not have to hard-code the per-variant output directory.
        echo "image_path=${IMAGE_PATH#"$GITHUB_WORKSPACE"/}" >> "$GITHUB_OUTPUT"
        echo "artifacts_dir=${ARTIFACTS_FOLDER#"$GITHUB_WORKSPACE"/}" >> "$GITHUB_OUTPUT"

        mv "${ARTIFACTS_FOLDER}/${OP_MODEL}_${OP_OS_VERSION}.txt" "$AK3_FOLDER/"
        cd "$AK3_FOLDER"

        sed -i 's/do.check_boot_version=.*/do.check_boot_version=1/' anykernel.sh

        case "$OP_BRANCH" in
          wild/sm8850|wild/sm8845)
            echo "Applying BBG efisp abl whitelist control patch"
            patch -p1 < "$KERNEL_PATCHES_FOLDER/common/bbg/0001-Enable-volume-input-to-enable-bbg-efisp-patch.patch"
          ;;
        esac

        ZIP_MODEL=$(echo "$OP_MODEL" | sed 's/-[0-9]\+\.[0-9]\+\.[0-9]\+$//')
        echo "ZIP_MODEL=$ZIP_MODEL" >> "$GITHUB_ENV"
        if [ "${{ env.OP_SUSFS }}" = true ]; then
          ZIP_NAME="AK3_${ZIP_MODEL}_${OP_OS_VERSION}_${KERNEL_FULL_VER}_${{ inputs.ksu_type }}_${KSUVER:-unknown}_SuSFS_${SUSVER:-unknown}.zip"
        else
          ZIP_NAME="AK3_${ZIP_MODEL}_${OP_OS_VERSION}_${KERNEL_FULL_VER}_${{ inputs.ksu_type }}_${KSUVER:-unknown}.zip"
        fi
        mkdir -p "$ARTIFACTS_FOLDER"

        echo "Creating flashable ZIP: $ZIP_NAME"

        if ! zip -r9 "$ZIP_NAME" ./* \
             -x "*.git*" \
             -x "$ZIP_NAME" \
             -x "README.md" 2>&1 | tee /tmp/zip.log; then
          echo "::error::Failed to create ZIP package"
          exit 1
        fi

        mv "$ZIP_NAME" "$ARTIFACTS_FOLDER/"

        find "$ARTIFACTS_FOLDER" -maxdepth 1 -type f ! -name "$ZIP_NAME" -delete

        ZIP_SIZE=$(stat -c%s "$ARTIFACTS_FOLDER/$ZIP_NAME")
        ZIP_SHA256=$(sha256sum "$ARTIFACTS_FOLDER/$ZIP_NAME" | awk '{print $1}')
        printf 'zip_sha256=%s\n' "$ZIP_SHA256" >> "$GITHUB_OUTPUT"

        echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
        echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

        echo ""
        echo "✅ Kernel ZIP created successfully"
        echo "   Name: $ZIP_NAME"
        echo "   Size: $(numfmt --to=iec-i --suffix=B "$ZIP_SIZE")"
        echo "   SHA256: $ZIP_SHA256"
        echo "::endgroup::"

    # Ports EmberHeart's kernel_modules_<MODEL>.zip. EmberHeart builds the
    # msm-kernel tree and filters out stock modules with a downloaded
    # default_modules.txt; we build only the GKI common tree, so instead of a
    # denylist we take an allowlist of the module source directories the
    # wireless/CAN configs above turn on. That keeps stock GKI modules out of
    # the ZIP without depending on an external, floating list.
    #
    # Must run after Create Kernel ZIP: that step prunes ARTIFACTS_FOLDER down
    # to the AnyKernel3 ZIP alone.
    - name: Create Kernel Modules ZIP
      id: create_modules_zip
      if: ${{ env.OP_WIRELESS_MODULES == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::Create kernel modules ZIP package"

        INSTALL_ROOT="$COMMON_KERNEL_FOLDER/out/install/lib/modules"
        if [ ! -d "$INSTALL_ROOT" ]; then
          echo "::error::modules_install output not found at $INSTALL_ROOT"
          exit 1
        fi

        UNAME_DIR=$(find "$INSTALL_ROOT" -mindepth 1 -maxdepth 1 -type d -print -quit)
        if [ -z "$UNAME_DIR" ]; then
          echo "::error::No kernel release directory under $INSTALL_ROOT"
          exit 1
        fi
        echo "Module release dir: $(basename "$UNAME_DIR")"

        # Source directories whose modules we ship. Matches the =m symbols set
        # by the Nethunter wireless step. These are only the seed: the real
        # set is the transitive closure over modules.dep, because a driver's
        # dependencies live outside these directories -- cfg80211 depends on
        # kernel/net/rfkill/rfkill.ko and mac80211 on kernel/lib/crypto/libarc4.ko.
        # Shipping the seed alone makes insmod fail with unknown symbols.
        #
        # On the DDK path kernel/drivers/net/wireless holds qca_cld3_<chipset>.ko
        # (staged by hand) plus the ath9k_*/zoo kos from msm-kernel. The closure
        # pulls in the vendor cfg80211/mac80211 all of them link against, and
        # out-of-seed deps like drivers/misc/eeprom/eeprom_93cx6.ko.
        MODULE_DIRS=(
          "kernel/net/wireless"
          "kernel/net/mac80211"
          "kernel/net/can"
          "kernel/drivers/net/wireless"
          "kernel/drivers/net/can"
          # CH341/FTDI/PL2303 adapters, which README lists under Nethunter.
          # They only became loadable modules when the CAN and USB-serial
          # stacks moved from =y to =m, so this directory was previously empty.
          "kernel/drivers/usb/serial"
        )

        DEP_FILE="$UNAME_DIR/modules.dep"
        if [ ! -f "$DEP_FILE" ]; then
          echo "[INFO] modules.dep absent; running depmod"
          depmod -b "$COMMON_KERNEL_FOLDER/out/install" "$(basename "$UNAME_DIR")" || true
        fi
        if [ ! -f "$DEP_FILE" ]; then
          echo "::error::modules.dep missing at $DEP_FILE; cannot resolve module dependencies"
          exit 1
        fi

        SEEDS=""
        for dir in "${MODULE_DIRS[@]}"; do
          if [ -d "$UNAME_DIR/$dir" ]; then
            SEEDS+="$( cd "$UNAME_DIR" && find "$dir" -type f -name '*.ko' )"$'\n'
          else
            echo "[INFO] No modules built under $dir"
          fi
        done

        SEED_COUNT=$(printf '%s' "$SEEDS" | grep -c '\.ko$' || true)
        if [ "$SEED_COUNT" -eq 0 ]; then
          echo "::error::Wireless modules were requested but none were built"
          exit 1
        fi

        # Close the seed set over modules.dep. Each line is
        #   kernel/net/wireless/cfg80211.ko: kernel/net/rfkill/rfkill.ko ...
        WANTED=$(awk -v seeds="$SEEDS" '
          BEGIN {
            n = split(seeds, s, "\n")
            for (i = 1; i <= n; i++) if (s[i] != "") want[s[i]] = 1
          }
          {
            key = $1
            sub(/:$/, "", key)
            for (i = 2; i <= NF; i++) dep[key] = dep[key] " " $i
          }
          END {
            changed = 1
            while (changed) {
              changed = 0
              split("", add)
              for (m in want) {
                k = split(dep[m], d, " ")
                for (i = 1; i <= k; i++)
                  if (d[i] != "" && !(d[i] in want)) add[d[i]] = 1
              }
              for (a in add) { want[a] = 1; changed = 1 }
            }
            for (m in want) print m
          }' "$DEP_FILE" | sort)

        STAGE=$(mktemp -d)
        while IFS= read -r rel; do
          [ -n "$rel" ] || continue
          if [ -f "$UNAME_DIR/$rel" ]; then
            cp -n -- "$UNAME_DIR/$rel" "$STAGE/"
          else
            echo "::warning::modules.dep lists $rel but it is not in the install tree"
          fi
        done <<< "$WANTED"

        MODULE_COUNT=$(find "$STAGE" -type f -name '*.ko' | wc -l)
        echo "Seeded from module dirs: $SEED_COUNT"
        echo "After dependency closure: $MODULE_COUNT"
        if [ "$MODULE_COUNT" -lt "$SEED_COUNT" ]; then
          echo "::error::Dependency closure lost modules ($MODULE_COUNT < $SEED_COUNT)"
          exit 1
        fi
        find "$STAGE" -type f -name '*.ko' -printf '  %f (%s bytes)\n' | sort

        # Assert the pack contains what the loader needs, rather than trusting
        # that the seed directories existed. Run 31029431344 shipped a
        # two-module ZIP from a green build because the staging tree was flat
        # and every seed directory was missing.
        missing=""
        if [ "$OP_DDK" = "true" ]; then
          # peach + vendor cfg/mac (CRC pair) + the external-driver zoo built
          # on msm-kernel against that same mac80211.
          for m in "qca_cld3_$(echo "$OP_DDK_CHIPSET" | tr '-' '_')" cfg80211 mac80211 \
                   ath9k_htc ath9k_hw ath9k_common ath \
                   carl9170 rtl8xxxu rt2800usb zd1211rw p54usb mt7921u; do
            [ -n "$(find "$STAGE" -name "$m.ko" -print -quit)" ] || missing="$missing $m.ko"
          done
        else
          for m in cfg80211 mac80211 ath9k_htc; do
            [ -n "$(find "$STAGE" -name "$m.ko" -print -quit)" ] || missing="$missing $m.ko"
          done
        fi
        if [ -n "$missing" ]; then
          echo "::error::Modules ZIP is missing:$missing"
          exit 1
        fi

        # Ship a flattened modules.dep next to the .ko files. The install-tree
        # copy uses paths ("kernel/net/wireless/cfg80211.ko: kernel/net/rfkill/
        # rfkill.ko"), but the ZIP is flat, so rewrite every entry to bare
        # module names and keep only modules actually in the pack. This is what
        # nethunter-wifi.sh walks to insmod a driver's dependencies in order.
        awk '
          {
            key = $1; sub(/:$/, "", key)
            gsub(/^.*\//, "", key); sub(/\.ko$/, "", key)
            line = key ":"
            for (i = 2; i <= NF; i++) {
              d = $i
              gsub(/^.*\//, "", d); sub(/\.ko$/, "", d)
              line = line " " d
            }
            print line
          }' "$DEP_FILE" > "$STAGE/modules.dep.all"

        awk 'NR == FNR { have[$1] = 1; next }
             {
               key = $1; sub(/:$/, "", key)
               if (!(key in have)) next
               line = key ":"
               for (i = 2; i <= NF; i++) if ($i in have) line = line " " $i
               print line
             }' \
          <(cd "$STAGE" && find . -name '*.ko' -printf '%f\n' | sed 's/\.ko$//') \
          "$STAGE/modules.dep.all" > "$STAGE/modules.dep"
        rm -f "$STAGE/modules.dep.all"

        DEP_LINES=$(wc -l < "$STAGE/modules.dep")
        echo "modules.dep entries: $DEP_LINES"
        if [ "$DEP_LINES" -ne "$MODULE_COUNT" ]; then
          echo "::error::modules.dep has $DEP_LINES entries for $MODULE_COUNT modules"
          exit 1
        fi

        # One-command loader. ath9k_htc and friends cannot be built into the
        # Image -- Kconfig would force CFG80211=y with them, which permanently
        # breaks the internal Wi-Fi (see the script's header comment) -- so ship
        # a script that does the unload/insmod dance instead.
        LOADER="$GITHUB_ACTION_PATH/files/nethunter-wifi.sh"
        if [ ! -f "$LOADER" ]; then
          echo "::error::loader script missing at $LOADER"
          exit 1
        fi
        install -m 755 "$LOADER" "$STAGE/nethunter-wifi.sh"

        MODULES_ZIP_NAME="kernel_modules_${ZIP_MODEL}_${OP_OS_VERSION}_${KERNEL_FULL_VER}.zip"
        ( cd "$STAGE" && zip -q -j -9 "$MODULES_ZIP_NAME" ./*.ko modules.dep nethunter-wifi.sh )
        mv "$STAGE/$MODULES_ZIP_NAME" "$ARTIFACTS_FOLDER/"
        rm -rf "$STAGE"

        MODULES_ZIP_SHA256=$(sha256sum "$ARTIFACTS_FOLDER/$MODULES_ZIP_NAME" | awk '{print $1}')
        printf 'modules_zip_name=%s\n' "$MODULES_ZIP_NAME" >> "$GITHUB_OUTPUT"
        printf 'modules_zip_sha256=%s\n' "$MODULES_ZIP_SHA256" >> "$GITHUB_OUTPUT"
        printf 'modules_count=%s\n' "$MODULE_COUNT" >> "$GITHUB_OUTPUT"
        echo "MODULES_ZIP_NAME=$MODULES_ZIP_NAME" >> "$GITHUB_ENV"

        echo ""
        echo "✅ Kernel modules ZIP created successfully"
        echo "   Name: $MODULES_ZIP_NAME"
        echo "   Modules: $MODULE_COUNT"
        echo "   SHA256: $MODULES_ZIP_SHA256"
        echo "::endgroup::"

    - name: Final Build Summary
      shell: bash
      run: |
        set -euo pipefail

        # Get commit SHAs with fallback
        KSU_SHA="${KSU_COMMIT_SHA:-unknown}"
        SUSFS_SHA="${SUSFS_COMMIT_SHA:-unknown}"

        {
          echo "Model: ${{ env.OP_MODEL }}"
          echo "OS Version: ${{ env.OP_OS_VERSION }}"
          echo "Android: ${{ env.ANDROID_VER }}"
          echo "Kernel base: ${{ env.KERNEL_VER }}"
          echo "Kernel full: ${{ env.KERNEL_FULL_VER }}"
          echo "Kernel Uname: ${{ env.KERNEL_UNAME }}"
          echo "Build User: ${{ env.BUILD_USER }}"
          echo "Build Host: ${{ env.BUILD_HOST }}"
          if [ "${{ inputs.ksu_type }}" = "KSUN" ]; then
            echo "KSUN Version: ${KSUVER:-unknown}"
            echo "KSUN commit SHA: ${KSU_SHA:-unknown}"
          else
            echo "KSU Version: ${KSUVER:-unknown}"
            echo "KSU commit SHA: ${KSU_SHA:-unknown}"
          fi
          if [ "${{ env.OP_SUSFS }}" = true ]; then
            echo "SUSFS Version: ${SUSVER:-unknown}"
            echo "SUSFS commit SHA: $SUSFS_SHA"
          fi
          echo "Optimization: ${{ inputs.optimize_level }}"
          echo "Clean Build: ${{ inputs.clean }}"
          echo ""
          echo "=== OnePlus Features ==="
          echo "Kernel Optimisations: ${{ env.OP_OPT }}"
          echo "BBR: ${{ env.OP_BBR }}"
          echo "BBRv3: ${{ env.OP_BBR3 }}"
          echo "BBG: ${{ env.OP_BBG }}"
          echo "HMBIRD SCX: ${{ env.OP_HMBIRD }}"
          echo "TTL: ${{ env.OP_TTL }}"
          echo "IP_SET & IPv6 NAT: ${{ env.OP_IP_SET }}"
          echo "Unicode Fix: ${{ env.OP_UNICODE }}"
          echo "NTSync: ${{ env.OP_NTSYNC }}"
          echo "Droidspaces: ${{ env.OP_DS }}"
          echo ""
          echo "Image SHA256: ${{ steps.collect_stats.outputs.image_sha256 }}"
          echo "AnyKernel3 ZIP SHA256: ${{ steps.create_zip.outputs.zip_sha256 }}"
          echo "Compiler: ${CLANG_VERSION:-unknown}"
          echo "Warnings Count: ${{ steps.collect_stats.outputs.warnings_count }}"
          echo "Build Time: ${{ steps.collect_stats.outputs.build_time }}s"
          if [ "${{ inputs.clean }}" == "false" ]; then
            echo "ccache Hit Rate: ${{ steps.ccache_stats.outputs.hit_rate }}"
            echo "ccache Direct Rate: ${{ steps.ccache_stats.outputs.direct_rate }}"
          else
            echo "ccache: Disabled (clean build)"
          fi
          echo "Artifact Name: ${{ env.ZIP_NAME }}"
        } | tee summary.txt

        {
          echo "### 🎯 Kernel Build Summary"
          echo ""
          echo "| Metric | Value |"
          echo "|--------|-------|"
          echo "| **Model** | ${{ env.OP_MODEL }} |"
          echo "| **OS Version** | ${{ env.OP_OS_VERSION }} |"
          echo "| **Kernel Version** | ${{ steps.save_metadata.outputs.kernel_version }} |"
          echo "| **Kernel Uname** | \`${{ env.KERNEL_UNAME }}\` |"
          echo "| **Build User** | ${{ env.BUILD_USER }} |"
          echo "| **Build Host** | ${{ env.BUILD_HOST }} |"
          if [ "${{ inputs.ksu_type }}" = "KSUN" ]; then
            echo "| **KSUN Version** | ${KSUVER:-unknown} |"
          else
            echo "| **KSU Version** | ${KSUVER:-unknown} |"
          fi

          if [ "$KSU_SHA" != "unknown" ]; then
            if [ "${{ inputs.ksu_type }}" = "KSUN" ]; then
              echo "| **KSUN Commit** | [\`${KSU_SHA:0:8}\`](https://github.com/KernelSU-Next/KernelSU-Next/commit/$KSU_SHA) |"
            else
              echo "| **KSU Commit** | [\`${KSU_SHA:0:8}\`](https://github.com/tiann/KernelSU/commit/$KSU_SHA) |"
            fi
          else
            echo "| **KSU Commit** | unknown |"
          fi

          if [ "${{ env.OP_SUSFS }}" = true ]; then
            echo "| **SUSFS Version** | ${SUSVER:-unknown} |"

            if [ "$SUSFS_SHA" != "unknown" ]; then
              echo "| **SUSFS Commit** | [\`${SUSFS_SHA:0:8}\`](https://gitlab.com/simonpunk/susfs4ksu/-/commit/$SUSFS_SHA) |"
            else
              echo "| **SUSFS Commit** | unknown |"
            fi
          fi

          echo ""
          echo "### 🔧 OnePlus Features"
          echo ""
          echo "| Feature | Status |"
          echo "|---------|--------|"
          echo "| **Kernel Optimisations** | ${{ env.OP_OPT }} |"
          echo "| **BBR** | ${{ env.OP_BBR }} |"
          echo "| **BBRv3** | ${{ env.OP_BBR3 }} |"
          echo "| **BBG** | ${{ env.OP_BBG }} |"
          echo "| **HMBIRD SCX** | ${{ env.OP_HMBIRD }} |"
          echo "| **TTL** | ${{ env.OP_TTL }} |"
          echo "| **IP_SET & IPv6 NAT** | ${{ env.OP_IP_SET }} |"
          echo "| **Unicode Fix** | ${{ env.OP_UNICODE }} |"
          echo "| **NTSync** | ${{ env.OP_NTSYNC }} |"
          echo "| **Droidspaces** | ${{ env.OP_DS }} |"

          echo ""
          echo "### 📊 Build Metrics"
          echo ""
          echo "| Metric | Value |"
          echo "|--------|-------|"
          echo "| **Optimization** | ${{ inputs.optimize_level }} |"
          echo "| **Clean Build** | ${{ inputs.clean }} |"
          echo "| **Build Time** | ${{ steps.collect_stats.outputs.build_time }}s |"

          if [ "${{ inputs.clean }}" == "false" ]; then
            echo "| **ccache Hit Rate** | ${{ steps.ccache_stats.outputs.hit_rate }} |"
            echo "| **ccache Direct Rate** | ${{ steps.ccache_stats.outputs.direct_rate }} |"
          fi

          echo "| **Image SHA256** | \`${{ steps.collect_stats.outputs.image_sha256 }}\` |"
          echo "| **Warnings** | ${{ steps.collect_stats.outputs.warnings_count }} |"
          echo "| **Compiler** | \`${CLANG_VERSION:-unknown}\` |"
          echo "| **Artifact Name** | \`${{ env.ZIP_NAME }}\` |"
          echo "| **AnyKernel3 SHA256** | \`${{ steps.create_zip.outputs.zip_sha256 }}\` |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Debug Artifacts
      if: ${{ always() && !cancelled() && inputs.debug == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.DEBUG_ZIP_NAME }}
        path: ${{ env.DEBUG_ARTIFACTS_FOLDER }}
        compression-level: 9
        retention-days: 90

    - name: Upload Artifacts
      if: success() && steps.create_zip.conclusion == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.ARTIFACTS_FOLDER }}/${{ env.ZIP_NAME }}
        archive: false
        compression-level: 0
        retention-days: 90

    - name: Upload Kernel Modules ZIP
      if: success() && steps.create_modules_zip.conclusion == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.MODULES_ZIP_NAME }}
        path: ${{ env.ARTIFACTS_FOLDER }}/${{ env.MODULES_ZIP_NAME }}
        archive: false
        compression-level: 0
        retention-days: 90

    - name: Stage qcacld DDK module artifact
      if: ${{ env.OP_DDK == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        KO=$(find "$COMMON_KERNEL_FOLDER/out/install/lib/modules" -type f -name 'qca_cld3_*.ko' -print -quit)
        [ -n "$KO" ] || { echo "::error::qca_cld3 DDK module not found"; exit 1; }
        cp -f "$KO" "$ARTIFACTS_FOLDER/qca_cld3_peach_v2.ko"
        echo "Staged qcacld DDK module for artifact upload: $ARTIFACTS_FOLDER/qca_cld3_peach_v2.ko"

    - name: Upload qcacld DDK module
      if: success() && env.OP_DDK == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: qca_cld3_peach_v2
        path: ${{ env.ARTIFACTS_FOLDER }}/qca_cld3_peach_v2.ko
        archive: false
        compression-level: 0
        retention-days: 90

    - name: Upload ccache log
      if: success() && inputs.debug == 'true' && steps.build_kernel_step.conclusion == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: "${{ env.OP_MODEL }}_${{ env.OP_OS_VERSION }}_${{ env.KERNEL_FULL_VER }}_ccache.log"
        path: ${{ env.CCACHE_LOGFILE }}
        archive: false
        compression-level: 0
        retention-days: 90

    - name: 📥 Checkout Code
      uses: actions/checkout@v6
      if: always() && steps.build_kernel_step.conclusion == 'success'
      with:
        path: main-source
        fetch-depth: 1

    - name: Save ccache cache
      if: always() && steps.build_kernel_step.conclusion == 'success'
      uses: ./.github/actions/cache/save
      with:
        cache_path: ${{ env.CCACHE_DIR }}
        cache_key: ${{ inputs.ksu_type }}-v3-${{ env.OP_MODEL }}-${{ env.OP_OS_VERSION }}-${{ env.KERNEL_FULL_VER }}-${{ env.CLANG_VERSION_SHORT }}-${{ env.OP_LTO }}_LTO
        cache_bucket: "ccache-cache"
        debug: ${{ inputs.debug }}
        github_token: ${{ inputs.github_token }}
        working_dir: "./main-source"
        compression_level: 6
